<circle cx="128" cy="128" r="121" fill="url(#rim)" stroke="#505866" stroke-width=".9"/>
<circle cx="128" cy="128" r="116" fill="url(#base)" stroke="#151a22" stroke-width="1.8"/>
<path d="M128 29 L120 43 L136 43 Z M227 128 L213 120 L213 136 Z M128 227 L120 213 L136 213 Z M29 128 L43 120 L43 136 Z" fill="#0f141b" opacity=".66"/>
<circle cx="128" cy="128" r="51" fill="#141922" stroke="#505660" stroke-width="1.1" opacity=".68"/>
<circle cx="128" cy="128" r="47" fill="url(#inner)" stroke="#111820" stroke-width="2.3"/>
<!-- The illuminated center is cropped pixel-for-pixel from the user's
     4974954.ai Illustrator PDF at PDF rect x=53..77, y=100..124.
     The PDF has rasterized masks; keep its original lighting in this tiny
     embedded image, with editable vector hardware housing around it. -->
<defs><clipPath id="aiLens"><circle cx="128" cy="128" r="44.5"/></clipPath></defs>
<image x="80" y="80" width="96" height="96" clip-path="url(#aiLens)"
 href="data:image/webp;base64,"/>
