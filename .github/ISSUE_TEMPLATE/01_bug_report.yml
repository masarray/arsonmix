name: "Report a problem"
description: "Something went wrong while installing or using ArSonMix? Tell us what you saw."
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ArSonMix. You do not need to know audio engineering or programming to report a problem.
        For suspected security vulnerabilities, follow https://github.com/masarray/arsonmix/security/policy instead of this public form.
        Please do not share passwords, license keys, private file paths or unredacted personal information.
        If this involves loud or unexpected output, lower your monitoring level before trying again.
  - type: input
    id: build
    attributes:
      label: "ArSonMix version and your computer (if known)"
      description: "For example: release tag from About, Windows version, audio interface/driver."
      placeholder: "Windows 11, ArSonMix release tag, interface model (optional if unknown)"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the problem in your own words. What were you expecting instead?"
      placeholder: "I clicked Start Audio, but the microphone level never moved. I expected to hear my voice."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "How can we reproduce it?"
      description: "A short step-by-step description helps even if you cannot reproduce it every time."
      placeholder: "1. Open ArSonMix... 2. Select my device... 3. Click Start..."
    validations:
      required: true
  - type: textarea
    id: technical
    attributes:
      label: "Optional audio details and evidence"
      description: "Driver name, sample rate/buffer, input/output routing, FX used, redacted screenshot or error text. Say if this was visual-only or audible on real hardware."
    validations:
      required: false
