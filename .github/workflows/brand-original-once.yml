name: Materialize approved ArSonMix master-derived icons (one-time)
on:
  push:
    branches: [feat/approved-master-brand-landing-readme-20261107]
    paths:
      - '.github/workflows/brand-original-once.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate physical favicon and Windows ICO assets
        run: |
          python scripts/sync_brand_assets.py
          python scripts/sync_brand_assets.py --check
          python tests/brand_icon_contract_test.py
          python tests/brand_package_files_test.py
      - name: Commit derived favicon and desktop icon binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon/ site/favicon.ico site/favicon-16x16.png site/favicon-32x32.png site/apple-touch-icon.png site/android-chrome-192x192.png site/android-chrome-512x512.png site/site.webmanifest site/arsonmix-48.png site/arsonmix-128.png site/brand-512.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(brand): regenerate master-derived Windows icons and favicons"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
