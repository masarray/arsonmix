name: Anti Noiz standalone DSP (fast)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'engine/builtin_fx/anti_noiz/**'
      - 'tests/anti_noiz_*.cpp'
      - 'tools/anti-noiz/**'
      - '.github/workflows/anti-noiz-fast-dsp.yml'

permissions:
  contents: read
concurrency:
  group: anti-noiz-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  standalone:
    name: Anti Noiz ${{ matrix.lane }} (no JUCE or installer)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: GCC Release
            compiler: g++
            config: Release
            sanitizers: 'OFF'
            benchmark: 'ON'
          - lane: Clang ASan UBSan
            compiler: clang++
            config: RelWithDebInfo
            sanitizers: 'ON'
            benchmark: 'OFF'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Configure isolated standard C++ DSP
        run: >
          cmake -S tools/anti-noiz -B "$RUNNER_TEMP/anti-noiz"
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DANTI_NOIZ_SANITIZERS=${{ matrix.sanitizers }}
          -DANTI_NOIZ_BENCHMARK=${{ matrix.benchmark }}
      - name: Compile and run regression
        run: |
          cmake --build "$RUNNER_TEMP/anti-noiz" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/anti-noiz" --output-on-failure --verbose
      - name: Record exploratory throughput (not a performance gate)
        if: matrix.benchmark == 'ON'
        run: '"$RUNNER_TEMP/anti-noiz/anti_noiz_bench"'

      - name: Opt-in active callback profile (exploratory)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        run: '"$RUNNER_TEMP/anti-noiz/anti_noiz_rt_profile"'
      - name: Checkout exact pre-drift reference (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        uses: actions/checkout@v4
        with:
          ref: 49e49c47c9e6b291feb74c5593806ffb296ba843
          path: .anti-noiz-drift-reference
          persist-credentials: false
      - name: Matched synthetic drift baseline and candidate (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -I .anti-noiz-drift-reference/tools/anti-noiz tests/anti_noiz_drift_pcm_test.cpp -o "$RUNNER_TEMP/anti-noiz-drift-baseline"
          echo "Baseline 49e49c47:"
          "$RUNNER_TEMP/anti-noiz-drift-baseline" --report-only
          echo "Candidate:"
          "$RUNNER_TEMP/anti-noiz/anti_noiz_drift_pcm_test" --report-only
      - name: Checkout exact pre-spectral reference (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        uses: actions/checkout@v4
        with:
          ref: 75bcb9e4daf9a91cd57dcbc83a8fda43b0b37d3c
          path: .anti-noiz-spectral-reference
          persist-credentials: false
      - name: Matched spectral drift baseline and candidate (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -I .anti-noiz-spectral-reference/tools/anti-noiz tests/anti_noiz_spectral_pcm_test.cpp -o "$RUNNER_TEMP/anti-noiz-spectral-baseline"
          echo "Spectral baseline 75bcb9e:"
          "$RUNNER_TEMP/anti-noiz-spectral-baseline" --report-only
          echo "Spectral candidate:"
          "$RUNNER_TEMP/anti-noiz/anti_noiz_spectral_pcm_test" --report-only
      - name: Checkout exact pre-RT-optimization reference (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        uses: actions/checkout@v4
        with:
          ref: 5e70bb38662370e4e6644d075ac61b1bea95289d
          path: .anti-noiz-rt-reference
          persist-credentials: false
      - name: Checkout immediate pre-control reference (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        uses: actions/checkout@v4
        with:
          ref: 8adec89d7e9270f46ff25fba54f5431167b55668
          path: .anti-noiz-control-reference
          persist-credentials: false
      - name: Diagnose sample-level PCM differences (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -I .anti-noiz-control-reference/engine/builtin_fx/anti_noiz tools/anti-noiz/pcm_diff_probe.cpp -o "$RUNNER_TEMP/anti-noiz-pcm-old"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -I engine/builtin_fx/anti_noiz tools/anti-noiz/pcm_diff_probe.cpp -o "$RUNNER_TEMP/anti-noiz-pcm-new"
          "$RUNNER_TEMP/anti-noiz-pcm-old" "$RUNNER_TEMP/anti-noiz-old"
          "$RUNNER_TEMP/anti-noiz-pcm-new" "$RUNNER_TEMP/anti-noiz-new"
          python3 tools/anti-noiz/compare_pcm.py "$RUNNER_TEMP/anti-noiz-old" "$RUNNER_TEMP/anti-noiz-new"
          rm -f "$RUNNER_TEMP"/anti-noiz-{old,new}-*.f32
      - name: Matched allocation, PCM parity and callback timing (opt-in)
        if: matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -DANTI_NOIZ_ALLOC_PROBE=1 -I .anti-noiz-rt-reference/engine/builtin_fx/anti_noiz tools/anti-noiz/rt_qualify.cpp -Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=aligned_alloc,--wrap=posix_memalign -o "$RUNNER_TEMP/anti-noiz-rt-baseline"
          python3 tools/anti-noiz/compare_rt.py "$RUNNER_TEMP/anti-noiz-rt-baseline" "$RUNNER_TEMP/anti-noiz/anti_noiz_rt_qualify"
      - name: Opt-in recorded audio smoke (local WAVs, no upload)
        if: ${{ !cancelled() && matrix.benchmark == 'ON' && contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke') }}
        run: python3 tools/anti-noiz/recorded_smoke.py "$RUNNER_TEMP/anti-noiz/anti_noiz_qualify" "$RUNNER_TEMP/anti-noiz-recorded-smoke" --compare-an03f

  numerical-reproducibility:
    name: Anti Noiz matched PCM reproducibility (opt-in)
    if: contains(github.event.pull_request.labels.*.name, 'anti-noiz-corpus-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8adec89d7e9270f46ff25fba54f5431167b55668
          path: .anti-noiz-control-reference
          persist-credentials: false
      - name: Build matched drivers and common-object adapter pair
        id: build_matched
        run: |
          set -euo pipefail
          cd tools/anti-noiz
          flags=(-std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror)
          wrap=(-Wl,--wrap=malloc,--wrap=calloc,--wrap=realloc,--wrap=free,--wrap=aligned_alloc,--wrap=posix_memalign)
          old=../../.anti-noiz-control-reference/engine/builtin_fx/anti_noiz
          new=../../engine/builtin_fx/anti_noiz
          g++ --version
          g++ "${flags[@]}" -DANTI_NOIZ_ALLOC_PROBE=1 -I "$old" rt_qualify.cpp "${wrap[@]}" -o "$RUNNER_TEMP/rt-old"
          g++ "${flags[@]}" -DANTI_NOIZ_ALLOC_PROBE=1 -I "$new" rt_qualify.cpp "${wrap[@]}" -o "$RUNNER_TEMP/rt-new"
          g++ "${flags[@]}" compare_rt_capture.cpp -o "$RUNNER_TEMP/rt-capture-compare"
          g++ "${flags[@]}" -DANTI_NOIZ_ALLOC_PROBE=1 -DANTI_NOIZ_MATCHED_BRIDGE=1 -c rt_qualify.cpp -o "$RUNNER_TEMP/rt-driver.o"
          g++ "${flags[@]}" -I "$old" -c RtQualificationBridge.cpp -o "$RUNNER_TEMP/rt-old-bridge.o"
          g++ "${flags[@]}" -I "$new" -c RtQualificationBridge.cpp -o "$RUNNER_TEMP/rt-new-bridge.o"
          sha256sum "$RUNNER_TEMP/rt-driver.o"
          g++ "$RUNNER_TEMP/rt-driver.o" "$RUNNER_TEMP/rt-old-bridge.o" "${wrap[@]}" -o "$RUNNER_TEMP/rt-bridge-old"
          g++ "$RUNNER_TEMP/rt-driver.o" "$RUNNER_TEMP/rt-new-bridge.o" "${wrap[@]}" -o "$RUNNER_TEMP/rt-bridge-new"
      - name: Capture actual benchmark input and output
        run: python3 tools/anti-noiz/diagnose_rt.py "$RUNNER_TEMP/rt-old" "$RUNNER_TEMP/rt-new" "$RUNNER_TEMP/rt-capture-compare"
      - name: Capture same common-object driver linked against both revisions
        if: ${{ !cancelled() && steps.build_matched.outcome == 'success' }}
        run: python3 tools/anti-noiz/diagnose_rt.py "$RUNNER_TEMP/rt-bridge-old" "$RUNNER_TEMP/rt-bridge-new" "$RUNNER_TEMP/rt-capture-compare"
      - name: Strict common-object PCM and timing gate
        if: ${{ !cancelled() && steps.build_matched.outcome == 'success' }}
        run: python3 tools/anti-noiz/compare_rt.py "$RUNNER_TEMP/rt-bridge-old" "$RUNNER_TEMP/rt-bridge-new"

  web-contract:
    name: Anti Noiz Web UX contract (Node, no Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: node tools/anti-noiz/web/contract.test.mjs
