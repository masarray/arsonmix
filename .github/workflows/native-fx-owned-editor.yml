name: Native FX owned editor + reopen FAT (focused Windows)
on:
  pull_request:
    paths:
      - 'src/Main.cpp'
      - 'src/NativeOwnedFloatingWindow.h'
      - 'src/NativeFxWin32Owner.h'
      - 'src/NativeFxWin32Owner.cpp'
      - 'tests/native_fx_win32_sdk_order_test.cpp'
      - 'tests/native_fx_win32_owner_test.cpp'
      - 'tests/native_fx_window_lifecycle_contract_test.py'
      - 'tests/native_fx_window_owner/**'
      - '.github/workflows/native-fx-owned-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: owned-fx-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-owned-fx:
    runs-on: windows-2022
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Verify selected Node runtime before bounded WIRE contract
        shell: pwsh
        run: |
          $node = (Get-Command node -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          Write-Host "WIRE fixture Node: $node"
          & $node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ARMIX_WIRE_TEST_NODE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Fail closed on all three native editor lifetime paths
        shell: pwsh
        run: python -m unittest discover -s tests -p native_fx_window_lifecycle_contract_test.py -v
      - name: Compile Win32 HWND host and both real SDK include orders (no JUCE or ASIO)
        shell: pwsh
        run: |
          cmake -S tests/native_fx_window_owner -B build-owned-fx -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-owned-fx --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify owned z-order, hide and reopen without global TOPMOST
        shell: pwsh
        run: |
          ctest --test-dir build-owned-fx -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
