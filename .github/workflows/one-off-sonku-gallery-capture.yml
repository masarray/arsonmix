name: One-off SonKu public screenshot capture
on:
  push:
    branches: [capture/sonku-gallery-20261128]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/sonku-gallery-20261128
      - name: Verify destination lease
        run: test "$(git rev-parse HEAD)" = 7202d4e5d5903e1c884996d30e43d37271fef814
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 213d2a4b861cd592c41c3ce6a4b318bf347b9e7b
          path: .capture-source
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Chromium capture dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Capture only SonKu using the existing original editor renderer
        working-directory: .capture-source
        env:
          PYTHONPATH: tests
          GITHUB_SHA: 213d2a4b861cd592c41c3ce6a4b318bf347b9e7b
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          from pathlib import Path
          script=Path("scripts/capture_public_fx_gallery.py").resolve()
          s=script.read_text()
          start=s.index("CASES = (")
          end=s.index("\n\n\ndef load",start)
          s=s[:start]+'CASES = (("8d-sonku", "armix.builtin.8d-sonku.v1", "#mxNativeSonKu"),)'+s[end:]
          start=s.index("    # Harmonice's separate HWND shell")
          end=s.index("    provenance = {",start)
          s=s[:start]+s[end:]
          exec(compile(s,str(script),"exec"),{"__file__":str(script),"__name__":"__main__"})
          PY
      - name: Update only shared SonKu image, provenance and geometry
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from PIL import Image
          import json,re,shutil
          root=Path("site/media")
          source=Path(".capture-source/site/media")
          name="fx-editor-8d-sonku.jpg"
          old=json.loads((root/"fx-gallery-provenance.json").read_text())
          fresh=json.loads((source/"fx-gallery-provenance.json").read_text())
          assert fresh["sourceCommit"]=="213d2a4b861cd592c41c3ce6a4b318bf347b9e7b"
          assert len(fresh["images"])==1
          record=fresh["images"][0]
          assert record["file"]==name and not record["actualWindowsScreenshot"] and not record["audioOrHardwareVerifiedByImage"]
          assert record["sha256"]==sha256((source/name).read_bytes()).hexdigest()
          previous=next(x for x in old["images"] if x["file"]==name)
          assert previous["sha256"]!=record["sha256"], "Capture identical; do not claim update"
          with Image.open(source/name) as im:
              im.verify()
          with Image.open(source/name) as im:
              w,h=im.size
          assert 440<=w<=1600 and 140<=h<=1000
          record.update(sourceCommit=fresh["sourceCommit"],nativeBundleApprovedPagesSha256=fresh["nativeBundleApprovedPagesSha256"],width=w,height=h)
          old["images"]=[record if x["file"]==name else x for x in old["images"]]
          old["notes"]+=" Top-level source fields describe the original gallery batch; an individual image may override them with its own exact capture source."
          shutil.copyfile(source/name,root/name)
          (root/"fx-gallery-provenance.json").write_text(json.dumps(old,indent=2,sort_keys=True)+"\n")
          p=Path("site/index.html")
          s,n=re.subn(r'(src="\./media/fx-editor-8d-sonku\.jpg" width=")\d+(" height=")\d+(")',lambda m:f'{m[1]}{w}{m[2]}{h}{m[3]}',p.read_text())
          assert n==2
          p.write_text(s)
          p=Path("scripts/public_fx_pages.py")
          s,n=re.subn(r'(image="fx-editor-8d-sonku\.jpg", width=)\d+(, height=)\d+',lambda m:f'{m[1]}{w}{m[2]}{h}',p.read_text())
          assert n==1
          p.write_text(s)
          p=root/"README.md"
          s=p.read_text()
          needle="`fx-gallery-provenance.json` records the exact source commit, source GUI"
          assert needle in s
          s=s.replace(needle,"The 8D-SonKu image was refreshed from the published alpha.33 source\n(`213d2a4b861cd592c41c3ce6a4b318bf347b9e7b`); its own source commit,\nbundle SHA-256 and dimensions override the original gallery batch metadata.\n\n"+needle,1)
          p.write_text(s)
          print("SONKU_CAPTURE_VERIFIED",w,h,record["sha256"])
          PY
      - name: Build and verify shared landing assets
        run: |
          python scripts/build_pages.py --out dist-pages --sha "$(git rev-parse HEAD)" --branch main
          python scripts/build_landing_assets.py dist-pages
          cmp site/media/fx-editor-8d-sonku.jpg dist-pages/media/fx-editor-8d-sonku.jpg
          test -f dist-pages/effects/8d-sonku/index.html
          grep -q 'fx-editor-8d-sonku.jpg' dist-pages/effects/8d-sonku/index.html
          grep -q 'site/media/fx-editor-8d-sonku.jpg' README.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sonku-alpha33-public-editor
          path: |
            site/media/fx-editor-8d-sonku.jpg
            site/media/fx-gallery-provenance.json
          if-no-files-found: error
      - name: Commit generated assets only to the existing draft PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/media/fx-editor-8d-sonku.jpg site/media/fx-gallery-provenance.json site/media/README.md site/index.html scripts/public_fx_pages.py
          git diff --cached --check
          git commit -m "docs: refresh original 8D-SonKu alpha.33 screenshot and provenance"
          git push origin HEAD:refs/heads/docs/sonku-gallery-20261128
