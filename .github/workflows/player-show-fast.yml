name: ArSon Player Show M1-M3 (fast source contracts)
on:
  pull_request:
    paths:
      - 'engine/player/**'
      - 'src/Main.cpp'
      - 'src/LiveAudioEngine.h'
      - 'site/preview-v2/assets/arson-player.js'
      - 'site/preview-v2/assets/mixer-contextual-buttons.js'
      - 'site/preview-v2/assets/mixer-contextual-buttons.css'
      - 'tests/player_show_edit_policy_test.cpp'
      - 'tests/player_waveform_index_test.cpp'
      - 'tests/player_crossfade_curve_test.cpp'
      - 'tests/player_show_transition_policy_test.cpp'
      - 'tests/player_transport_lifecycle_contract.test.mjs'
      - 'tests/player_live_show_ui_workflow.test.mjs'
      - 'tests/approved_player_v4_chromium_smoke.py'
      - '.github/workflows/player-show-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: player-show-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    name: M1-M2 edit+waveform native C++ and player JS parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run pure C++20 show policy and progressive waveform tests
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            tests/player_show_edit_policy_test.cpp \
            -o "$RUNNER_TEMP/player-show-edit-test"
          "$RUNNER_TEMP/player-show-edit-test"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pthread \
            tests/player_waveform_index_test.cpp \
            -o "$RUNNER_TEMP/player-waveform-test"
          "$RUNNER_TEMP/player-waveform-test"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tests/player_crossfade_curve_test.cpp \
            -o "$RUNNER_TEMP/player-crossfade-test"
          "$RUNNER_TEMP/player-crossfade-test"
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            tests/player_show_transition_policy_test.cpp \
            -o "$RUNNER_TEMP/player-transition-test"
          "$RUNNER_TEMP/player-transition-test"
      - name: Parse the approved player UI and execute live-show gestures
        run: |
          node --check site/preview-v2/assets/arson-player.js
          node --check site/preview-v2/assets/mixer-contextual-buttons.js
          node tests/player_transport_lifecycle_contract.test.mjs
          node tests/player_live_show_ui_workflow.test.mjs

  player-browser:
    name: Player actual assembled Chromium interaction and visual evidence
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/arson-player-') }}
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install playwright && python -m playwright install --with-deps chromium
      - run: python tests/approved_player_v4_chromium_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: player-v4-actual-gui
          path: player-visual-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
