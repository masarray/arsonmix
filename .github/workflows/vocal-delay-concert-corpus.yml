name: Vocal Delay VD16 controlled human vowel corpus
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
    paths:
      - 'engine/builtin_fx/vocal_delay/**'
      - 'tools/vocal-delay/**'
      - '.github/workflows/vocal-delay-concert-corpus.yml'
permissions:
  contents: read
concurrency:
  group: vd16-corpus-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  controlled-corpus:
    # Archived controlled corpus: explicit specialist opt-in only.
    if: contains(github.event.pull_request.labels.*.name, 'vocal-delay-corpus-smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build real DSP audition renderer
        run: g++ -std=c++17 -O2 -Wall -Wextra -Werror tools/vocal-delay/audition.cpp -o /tmp/vd-audition
      - name: Run pinned licensed human vowel corpus
        run: |
          mkdir -p vd16-corpus
          git rev-parse HEAD > vd16-corpus/source-sha.txt
          python3 tools/vocal-delay/controlled_corpus.py /tmp/vd-audition vd16-corpus
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vocal-delay-vd16-controlled-corpus
          path: vd16-corpus/
          if-no-files-found: error
