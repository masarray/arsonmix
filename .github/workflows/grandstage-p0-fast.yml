name: GrandStage P0 fast native DSP
on:
  pull_request:
    paths:
      - 'engine/builtin_fx/GrandStageDsp.h'
      - 'engine/builtin_fx/GrandStageProcessor.h'
      - 'tests/grandstage_p0_music_preservation_test.cpp'
      - '.github/workflows/grandstage-p0-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pcm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile actual P8.2 source (no JUCE/installer)
        shell: bash
        run: |
          g++ -std=c++20 -O1 -Wall -Wextra -Werror \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            tests/grandstage_p0_music_preservation_test.cpp -o grandstage_music_test
      - name: Verify dry/bass/stereo/energy/chunk parity at 44.1 and 48 kHz
        run: ./grandstage_music_test
