name: Native CodeQL security analysis (no build)
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 2 * *'
permissions:
  contents: read
jobs:
  analyze:
    if: github.repository == 'masarray/arsonmix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: c-cpp
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:c-cpp/native-no-build
