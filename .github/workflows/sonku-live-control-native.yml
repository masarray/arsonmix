name: SonKu live controls — focused native JUCE regression
on:
  pull_request:
    paths:
      - 'engine/builtin_fx/SonKuSpatialProcessor.h'
      - 'src/SonKuNativeBridgeContract.h'
      - 'tests/sonku_native_state_test.cpp'
      - 'tests/sonku_p90_native_juce_v11_test.cpp'
      - '.github/workflows/sonku-live-control-native.yml'
permissions:
  contents: read
concurrency:
  group: sonku-live-controls-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'fix/sonku-') }}
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact acoustic source identity and control variant
        run: python scripts/verify_immersib_approved_pcm_sources.py
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: juce-framework/JUCE
          ref: 91ad83ae34a81e0833b1a2b0866f54846370ae53
          path: third_party/JUCE
          persist-credentials: false
      - name: Install pinned WebView2 SDK
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
      - name: Configure actual branded feature set
        shell: pwsh
        run: |
          cmake -S . -B build -G 'Visual Studio 17 2022' -A x64 "-DJUCE_ROOT=$env:GITHUB_WORKSPACE/third_party/JUCE" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:GITHUB_WORKSPACE/.deps" -DBUILD_TESTING=ON -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON -DARMIX_SONKU_APPROVED_P99_MAIN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build only the SonKu and ImmerSIB native adapter test targets
        run: cmake --build build --config Release --parallel 2 --target ARMixSonKuNativeStateTests ARMixSonKuP90NativeTests ARMixImerSipP92NativeTests
      - name: Require all three CTest targets and run actual native PCM regressions
        shell: pwsh
        run: |
          $pattern='^(NativeSonKuSessionV1V2AndAudioAppliedAck|NativeSonKuP90JuceV11AppliedAckAndLegacyRestore|NativeImmerSIBJucePresetACKStateAndBypass)$'
          $listing=ctest --test-dir build -C Release -R $pattern --show-only=json-v1 | ConvertFrom-Json
          if (@($listing.tests).Count -ne 3) { throw 'SONKU_NATIVE_TARGETS_MISSING' }
          ctest --test-dir build -C Release -R $pattern --output-on-failure --no-tests=error --output-junit sonku-control-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: SonKu-live-control-native-${{ github.event.pull_request.head.sha }}
          path: build/sonku-control-tests.xml
          if-no-files-found: warn
          retention-days: 7
