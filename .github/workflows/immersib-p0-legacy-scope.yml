name: P0 FIR legacy golden isolation and branded parity
on:
  push:
    branches:
      - perf/immersib-p0-active-fir-20261124
    paths:
      - tools/immersib_p0_legacy_scope_gate.py
      - tools/immersib_p0_active_fir_gate.py
      - tools/immersib_p0_product_pcm.cpp
      - .github/workflows/immersib-p0-legacy-scope.yml
permissions:
  contents: read
concurrency:
  group: p0-fir-legacy-scope
  cancel-in-progress: true
jobs:
  legacy-and-branded:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Same legacy golden and four-way branded PCM
        run: python tools/immersib_p0_legacy_scope_gate.py
      - name: Scoped candidate exact active CPU and stream parity
        run: python tools/immersib_p0_active_fir_gate.py --scoped
  branded-msvc:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: MSVC exact branded four-way PCM
        shell: pwsh
        run: |
          $pf86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $vswhere = Join-Path $pf86 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsroot = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vsroot) { throw 'MSVC_CPP_TOOLCHAIN_MISSING' }
          $vcvars = Join-Path $vsroot 'VC\Auxiliary\Build\vcvars64.bat'
          $cmdline = 'call "' + $vcvars + '" >nul && python tools/immersib_p0_legacy_scope_gate.py --msvc && python tools/immersib_p0_active_fir_gate.py --msvc --scoped'
          & cmd.exe /D /C $cmdline
          if ($LASTEXITCODE -ne 0) { throw 'P0_SCOPED_BRANDED_MSVC_FAILED' }
