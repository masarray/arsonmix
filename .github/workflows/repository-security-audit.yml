name: Repository Security Audit
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'config/supply-chain-baseline.json'
      - 'scripts/supply_chain_audit.mjs'
      - 'tests/supply_chain_audit.test.mjs'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/repository_security_audit.mjs'
      - 'tests/repository_security_audit.test.mjs'
      - 'docs/security/rulesets/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/dependabot.yml'
      - 'config/supply-chain-baseline.json'
      - 'scripts/supply_chain_audit.mjs'
      - 'tests/supply_chain_audit.test.mjs'
      - 'scripts/repository_security_audit.mjs'
      - 'tests/repository_security_audit.test.mjs'
      - 'docs/security/rulesets/**'
  schedule:
    - cron: '19 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-contract:
    if: github.repository == 'masarray/arsonmix'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository policy and negative drift fixtures
        run: node --test tests/repository_security_audit.test.mjs tests/supply_chain_audit.test.mjs
      - name: Verify workflow pins and dependency inventory (no compiler)
        run: node scripts/supply_chain_audit.mjs
      - name: Audit live public metadata from trusted main only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/repository_security_audit.mjs
