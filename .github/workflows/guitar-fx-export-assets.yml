name: Guitar FX hardware PNG export (temporary branch-only)
# One-shot build provenance: commit the 12 deterministic generator outputs
# into this feature PR. Do NOT run on main, releases, or other feature branches.
on:
  push:
    branches:
      - feat/guitar-fx-geometry-first-juce-redesign-20261113
    paths:
      - 'scripts/build_guitar_fx_layered_assets.mjs'
      - 'design-references/guitar-fx/hardware-layout.json'
      - '.github/workflows/guitar-fx-export-assets.yml'
permissions:
  contents: write
concurrency:
  group: guitar-art-export
  cancel-in-progress: true
jobs:
  one-shot-export:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate independent reproducible production PNGs
        run: |
          node scripts/build_guitar_fx_layered_assets.mjs
          node --test tests/guitar_fx_assets_contract.test.mjs
      - name: Persist only generated PNGs back to feature PR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- design-references/guitar-fx/assets/gfx-*.png
          git rm -f --ignore-unmatch design-references/guitar-fx/assets/gfx-panel.png
          if git diff --cached --quiet; then
            echo 'Production PNGs already match deterministic generator'
          else
            git commit -m "Guitar FX: commit twelve generated geometry-v2 hardware PNG layers"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
