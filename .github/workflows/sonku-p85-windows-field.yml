name: SonKu P8.5 world-coherence native mixer portable FAT x64
# Private JUCE app; no public release. Real v5 P8.2/P8.4 A/B.
on:
  pull_request:
    paths:
      - '.github/workflows/sonku-p85-windows-field.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonku-p85-field-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preflight:
    name: Isolated fast PCM and GUI preflight
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Strict P8.4 PCM timbre and spatial source qualification
        run: |
          set -euo pipefail
          FLAGS="-std=c++20 -O2 -Wall -Wextra -Werror -pedantic -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 -DSONKU_P72_NATIVE_XYZ_RT=1 -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1"
          g++ $FLAGS tests/sonku_p84_fused_single_core_test.cpp -o /tmp/p84-native
          /tmp/p84-native | tee /tmp/p84-source.log
          grep -q '^PASS P84 SINGLE CORE:' /tmp/p84-source.log
          g++ $FLAGS tests/sonku_p84_spatial_impulse_evidence_test.cpp -o /tmp/p84-spatial
          /tmp/p84-spatial | tee /tmp/p84-spatial.log
          grep -q '^PASS P84 SPATIAL SOURCE:' /tmp/p84-spatial.log
          g++ $FLAGS tests/sonku_p84_live_v5_modes_source_test.cpp -o /tmp/p84-live-mode
          /tmp/p84-live-mode | tee /tmp/p84-live-mode.log
          grep -q '^PASS P84 V5 NATIVE SOURCE:' /tmp/p84-live-mode.log
          g++ $FLAGS -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 tests/sonku_p85_world_locked_source_test.cpp -o /tmp/p85-source
          /tmp/p85-source | tee /tmp/p85-source.log
          grep -q '^PASS P85 WORLD LOCK:' /tmp/p85-source.log
      - name: Native JS and source GUI capability checks
        run: |
          set -euo pipefail
          node --check site/preview-v2/assets/mixer-native-sonku.js
          node tests/sonku_p73_gui_contract_test.js
          grep -q "'FIELD_PREVIEW_FULL_CTEST_NOT_RUN'" scripts/m3e_fat_evidence_gate.mjs
          python -m unittest discover -s tests -p native_peq_assembly_test.py
      - name: 44.1 and 48 kHz prepared PCM source regression
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            tests/sonku_p72_realtime_xyz_test.cpp -o /tmp/sonku-p75-pcm
          /tmp/sonku-p75-pcm
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            tests/sonku_p75_stereo_integrity_test.cpp -o /tmp/sonku-p75-music
          /tmp/sonku-p75-music
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            tests/sonku_p80_tonal_room_evidence_test.cpp -o /tmp/sonku-p80-evidence
          /tmp/sonku-p80-evidence | tee /tmp/sonku-p80-acoustic-evidence.csv
          grep -q '^PASS P8:' /tmp/sonku-p80-acoustic-evidence.csv
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            tests/sonku_p82_sixsurface_multiband_room_test.cpp -o /tmp/sonku-p82-room
          /tmp/sonku-p82-room | tee /tmp/sonku-p82-room-evidence.csv
          grep -q '^PASS P8.2:' /tmp/sonku-p82-room-evidence.csv
  windows-field:
    name: Actual full Windows JUCE executable and verified portable field ZIP
    needs: preflight
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable PR head and physical candidate identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA -or $actual -notmatch '^[0-9a-f]{40}$') {
            throw "SONKU_P83_SOURCE_MISMATCH:$actual"
          }
          Write-Host "SONKU_P84_EXACT_SOURCE=$actual"
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Obtain pinned WebView2 compilation SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure full native app with research XYZ explicit ON
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_ROOT="$env:GITHUB_WORKSPACE/third_party/JUCE" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE/.deps" `
            -DARMIX_SONKU_EXPERIMENTAL_NATIVE_XYZ_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_MUSIC_SAFE=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P8_TRANSPARENT_BASS=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P82_ROOM=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P83_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P84_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P85_NATIVE_RT=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Get-Content -LiteralPath build/CMakeCache.txt -Raw
          if ($cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_NATIVE_XYZ_RT:BOOL=ON' -or
              $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_MUSIC_SAFE:BOOL=ON' -or
              $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_P8_TRANSPARENT_BASS:BOOL=ON' -or
              $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_P82_ROOM:BOOL=ON' -or
              $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_P83_NATIVE_RT:BOOL=ON' -or
              $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_P84_NATIVE_RT:BOOL=ON' -or
               $cache -notmatch 'ARMIX_SONKU_EXPERIMENTAL_P85_NATIVE_RT:BOOL=ON') {
            throw "SONKU_P83_RESEARCH_NOT_ENABLED"
          }
          $tests = (& ctest --test-dir build -C Release --show-only=json-v1 | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $required = @('NativeSonKuP72AtomicXyzLiveEditSource',
                        'NativeSonKuP72JuceV3XyzLiveAckV1V2Restore',
                        'NativeSonKuSessionV1V2AndAudioAppliedAck',
                        'NativeSonKuP75MusicStereoPhaseNoNullAndChunkParity',
                        'NativeSonKuP80TransparentBassStereoPhaseAndRoomDiagnostic',
                        'NativeSonKuP82SixWallThreeBandRoomTimingDecayAndParity',
                        'NativeSonKuP83RealtimeModeSourceAndMusicIntegrity',
                        'NativeSonKuP83JuceV4AudioAckLegacyRestoreAndHeadYaw',
                        'NativeSonKuP84SingleCoreMusicFidelityAndWorldYaw',
                        'NativeSonKuP84JuceV5AudioAckLegacySafeRestore',
                         'NativeSonKuP85WorldCoherentMidYawSourceAndFidelity',
                         'NativeSonKuP85JuceV6AudioAckLegacySafeRestore')
          $available = @($tests.tests | ForEach-Object { $_.name })
          foreach ($test in $required) {
            if ($test -notin $available) { throw "SONKU_P82_MISSING_CTEST:$test" }
          }
      - name: Fail fast — compile and execute real JUCE v5 state + PCM ACK first
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixSonKuP85NativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure -R '^NativeSonKuP85JuceV6AudioAckLegacySafeRestore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual ARMixConsole Windows GUI and focused real JUCE tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target `
            ARMixConsole ARMixSonKuP72SourceTests ARMixSonKuP72NativeTests ARMixSonKuNativeStateTests ARMixSonKuP75MusicIntegrityTests ARMixSonKuP80TonalEvidenceTests ARMixSonKuP82RoomTests ARMixSonKuP83LiveSourceTests ARMixSonKuP83NativeTests ARMixSonKuP84LiveSourceTests ARMixSonKuP84NativeTests ARMixSonKuP85WorldSourceTests ARMixSonKuP85NativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'build/ARMixConsole_artefacts/Release/AR MIX Studio.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "SONKU_P83_NO_GUI_EXE" }
          if ((Get-Item -LiteralPath $exe).Length -lt 4MB) { throw "SONKU_P83_WRONG_GUI_TARGET" }
      - name: Scoped native XYZ state, callback ACK and legacy restoration
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure `
            -R '^NativeSonKu(P72AtomicXyzLiveEditSource|P72JuceV3XyzLiveAckV1V2Restore|SessionV1V2AndAudioAppliedAck|P75MusicStereoPhaseNoNullAndChunkParity|P80TransparentBassStereoPhaseAndRoomDiagnostic|P82SixWallThreeBandRoomTimingDecayAndParity|P83RealtimeModeSourceAndMusicIntegrity|P83JuceV4AudioAckLegacyRestoreAndHeadYaw|P84SingleCoreMusicFidelityAndWorldYaw|P84JuceV5AudioAckLegacySafeRestore|P85WorldCoherentMidYawSourceAndFidelity|P85JuceV6AudioAckLegacySafeRestore)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package real native portable mixer, never an installer
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist --best-effort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact experiment and physical qualification pending
        shell: pwsh
        run: |
          $path = 'dist/BUILD_PROVENANCE.json'
          $p = Get-Content -LiteralPath $path -Raw -Encoding utf8 | ConvertFrom-Json
          $sha = (& git rev-parse HEAD).Trim()
          if ($p.sourceCommit -ne $sha) { throw "SONKU_P83_ARTIFACT_SHA_MISMATCH" }
          $p.fatStatus = 'FIELD_PREVIEW_FULL_CTEST_NOT_RUN'
          $p | Add-Member -NotePropertyName sonkuExperiment -NotePropertyValue @{
            enabled = $true
            nativeXYZ = $true
            musicSafeStereo = $true
            p8TransparentBass = $true
            p82MultibandRoom = $true
            p83NativeSpeakers = $false
            p84FusedNative = $true
            p85WorldLockedMid = $true
            p84RenderModes = @('MusicBedP82','MusicSpatialP84','MusicSpatialP85')
            p83HeadYaw = 'DETERMINISTIC_MANUAL_NO_SENSOR'
            p84FusionDifferenceHighpassHz = 750
            p84MeasuredHrirContrast = 0.12
            legacyP83V4Migration = 'OLD_SPEAKER_TO_P82'
            p83AudioAppliedAck = $true
            p83RealtimeModeCrossfade = '12ms_OUT_AND_IN_NATIVE_SINGLE_PCM_GRAPH'
            p82RoomBandsHz = @(250,4800)
            p82MaterialCalibration = 'ORIGINAL_ILLUSTRATIVE_NOT_MEASURED_RIR'
            p82Rt60StudioSeconds = @(0.717,0.392,0.231)
            p82Rt60ChamberSeconds = @(0.933,0.802,0.483)
            p82Rt60HallSeconds = @(1.716,1.219,0.650)
            p8LowBandCrossoverHz = 220
            musicSafeAlgorithm = 'MEASURED_CENTER_MID_PLUS_UNCONDITIONAL_STEREO_SIDE_RESEARCH'
            stateSchema = 6
            fullWindowsExecutable = $true
            publicRelease = $false
            physicalAsioQualified = $false
            dearVrPerceptualParityProven = $false
            qualification = 'SONKU_P85_SCOPED_NATIVE_PCM_AND_JUCE_SOFTWARE_ONLY_HEADPHONE_FAT_PENDING'
            licenseRedistributionApproval = $false
            mitKemarNoticeSha256 = (Get-FileHash -LiteralPath docs/THIRD_PARTY_8D_SONKU_HRTF.md -Algorithm SHA256).Hash.ToLowerInvariant()
            fieldFatGuideSha256 = (Get-FileHash -LiteralPath docs/SONKU_P85_WORLD_HEAD_COHERENCE_20261115.md -Algorithm SHA256).Hash.ToLowerInvariant()
          } -Force
          $p | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $path -Encoding utf8
      - name: Independent GUI PE, approved resources, provenance and ZIP verification
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content -LiteralPath dist/BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          if (-not $p.sonkuExperiment.enabled -or
              -not $p.sonkuExperiment.musicSafeStereo -or
              -not $p.sonkuExperiment.p8TransparentBass -or
              -not $p.sonkuExperiment.p82MultibandRoom -or
              -not $p.sonkuExperiment.p84FusedNative -or
              -not $p.sonkuExperiment.p85WorldLockedMid -or
              $p.sonkuExperiment.stateSchema -ne 6 -or $p.sonkuExperiment.publicRelease) {
            throw 'SONKU_P85_WRONG_FIELD_ARTIFACT'
          }
      - name: Include mandatory MIT KEMAR notice and physical FAT guide
        shell: pwsh
        run: |
          # Standard distribution allowlist was verified above. Field-only notice.
          Copy-Item -LiteralPath docs/THIRD_PARTY_8D_SONKU_HRTF.md -Destination dist/THIRD_PARTY_8D_SONKU_HRTF.md
          Copy-Item -LiteralPath docs/SONKU_P85_WORLD_HEAD_COHERENCE_20261115.md -Destination dist/SONKU_P85_FIELD_FAT.md
          $p = Get-Content -LiteralPath dist/BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          $checks = @{
            'THIRD_PARTY_8D_SONKU_HRTF.md' = [string]$p.sonkuExperiment.mitKemarNoticeSha256
            'SONKU_P85_FIELD_FAT.md' = [string]$p.sonkuExperiment.fieldFatGuideSha256
          }
          foreach ($item in $checks.GetEnumerator()) {
            $file = Join-Path dist $item.Key
            if ($item.Value -notmatch '^[0-9a-f]{64}$' -or
                -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "SONKU_P83_FIELD_NOTICE_MISSING:$($item.Key)"
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $item.Value) { throw "SONKU_P83_FIELD_NOTICE_HASH_MISMATCH:$($item.Key)" }
          }
          if (Test-Path -LiteralPath dist/Studio) { throw 'SONKU_FIELD_USER_DATA_MUST_NOT_SHIP' }
          Write-Host 'SONKU_P85_FIELD_READY: GUI EXE + verified MIT notice + FAT guide'
      - uses: actions/upload-artifact@v4
        name: Upload isolated SonKu Windows x64 field candidate
        with:
          name: ArSonMix-SonKu-P85-World-Coherence-Windows-x64-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 21
          compression-level: 0

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual ARMixConsole Windows GUI and focused real JUCE tests
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target `
            ARMixConsole ARMixSonKuP72SourceTests ARMixSonKuP72NativeTests ARMixSonKuNativeStateTests ARMixSonKuP75MusicIntegrityTests ARMixSonKuP80TonalEvidenceTests ARMixSonKuP82RoomTests ARMixSonKuP83LiveSourceTests ARMixSonKuP83NativeTests ARMixSonKuP84LiveSourceTests ARMixSonKuP84NativeTests ARMixSonKuP85WorldSourceTests ARMixSonKuP85NativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'build/ARMixConsole_artefacts/Release/AR MIX Studio.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "SONKU_P83_NO_GUI_EXE" }
          if ((Get-Item -LiteralPath $exe).Length -lt 4MB) { throw "SONKU_P83_WRONG_GUI_TARGET" }
      - name: Scoped native XYZ state, callback ACK and legacy restoration
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure `
            -R '^NativeSonKu(P72AtomicXyzLiveEditSource|P72JuceV3XyzLiveAckV1V2Restore|SessionV1V2AndAudioAppliedAck|P75MusicStereoPhaseNoNullAndChunkParity|P80TransparentBassStereoPhaseAndRoomDiagnostic|P82SixWallThreeBandRoomTimingDecayAndParity|P83RealtimeModeSourceAndMusicIntegrity|P83JuceV4AudioAckLegacyRestoreAndHeadYaw|P84SingleCoreMusicFidelityAndWorldYaw|P84JuceV5AudioAckLegacySafeRestore)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package real native portable mixer, never an installer
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist --best-effort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record exact experiment and physical qualification pending
        shell: pwsh
        run: |
          $path = 'dist/BUILD_PROVENANCE.json'
          $p = Get-Content -LiteralPath $path -Raw -Encoding utf8 | ConvertFrom-Json
          $sha = (& git rev-parse HEAD).Trim()
          if ($p.sourceCommit -ne $sha) { throw "SONKU_P83_ARTIFACT_SHA_MISMATCH" }
          $p.fatStatus = 'FIELD_PREVIEW_FULL_CTEST_NOT_RUN'
          $p | Add-Member -NotePropertyName sonkuExperiment -NotePropertyValue @{
            enabled = $true
            nativeXYZ = $true
            musicSafeStereo = $true
            p8TransparentBass = $true
            p82MultibandRoom = $true
            p83NativeSpeakers = $false
            p84FusedNative = $true
            p85WorldLockedMid = $true
            p84RenderModes = @('MusicBedP82','MusicSpatialP84','MusicSpatialP85')
            p83HeadYaw = 'DETERMINISTIC_MANUAL_NO_SENSOR'
            p84FusionDifferenceHighpassHz = 750
            p84MeasuredHrirContrast = 0.12
            legacyP83V4Migration = 'OLD_SPEAKER_TO_P82'
            p83AudioAppliedAck = $true
            p83RealtimeModeCrossfade = '12ms_OUT_AND_IN_NATIVE_SINGLE_PCM_GRAPH'
            p82RoomBandsHz = @(250,4800)
            p82MaterialCalibration = 'ORIGINAL_ILLUSTRATIVE_NOT_MEASURED_RIR'
            p82Rt60StudioSeconds = @(0.717,0.392,0.231)
            p82Rt60ChamberSeconds = @(0.933,0.802,0.483)
            p82Rt60HallSeconds = @(1.716,1.219,0.650)
            p8LowBandCrossoverHz = 220
            musicSafeAlgorithm = 'MEASURED_CENTER_MID_PLUS_UNCONDITIONAL_STEREO_SIDE_RESEARCH'
            stateSchema = 6
            fullWindowsExecutable = $true
            publicRelease = $false
            physicalAsioQualified = $false
            dearVrPerceptualParityProven = $false
            qualification = 'SONKU_P85_SCOPED_NATIVE_PCM_AND_JUCE_SOFTWARE_ONLY_HEADPHONE_FAT_PENDING'
            licenseRedistributionApproval = $false
            mitKemarNoticeSha256 = (Get-FileHash -LiteralPath docs/THIRD_PARTY_8D_SONKU_HRTF.md -Algorithm SHA256).Hash.ToLowerInvariant()
            fieldFatGuideSha256 = (Get-FileHash -LiteralPath docs/SONKU_P85_WORLD_HEAD_COHERENCE_20261115.md -Algorithm SHA256).Hash.ToLowerInvariant()
          } -Force
          $p | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $path -Encoding utf8
      - name: Independent GUI PE, approved resources, provenance and ZIP verification
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = Get-Content -LiteralPath dist/BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          if (-not $p.sonkuExperiment.enabled -or
              -not $p.sonkuExperiment.musicSafeStereo -or
              -not $p.sonkuExperiment.p8TransparentBass -or
              -not $p.sonkuExperiment.p82MultibandRoom -or
              -not $p.sonkuExperiment.p84FusedNative -or
              -not $p.sonkuExperiment.p85WorldLockedMid -or
              $p.sonkuExperiment.stateSchema -ne 6 -or $p.sonkuExperiment.publicRelease) {
            throw 'SONKU_P85_WRONG_FIELD_ARTIFACT'
          }
      - name: Include mandatory MIT KEMAR notice and physical FAT guide
        shell: pwsh
        run: |
          # Standard distribution allowlist was verified above. Field-only notice.
          Copy-Item -LiteralPath docs/THIRD_PARTY_8D_SONKU_HRTF.md -Destination dist/THIRD_PARTY_8D_SONKU_HRTF.md
          Copy-Item -LiteralPath docs/SONKU_P85_WORLD_HEAD_COHERENCE_20261115.md -Destination dist/SONKU_P85_FIELD_FAT.md
          $p = Get-Content -LiteralPath dist/BUILD_PROVENANCE.json -Raw | ConvertFrom-Json
          $checks = @{
            'THIRD_PARTY_8D_SONKU_HRTF.md' = [string]$p.sonkuExperiment.mitKemarNoticeSha256
            'SONKU_P85_FIELD_FAT.md' = [string]$p.sonkuExperiment.fieldFatGuideSha256
          }
          foreach ($item in $checks.GetEnumerator()) {
            $file = Join-Path dist $item.Key
            if ($item.Value -notmatch '^[0-9a-f]{64}$' -or
                -not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "SONKU_P83_FIELD_NOTICE_MISSING:$($item.Key)"
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $item.Value) { throw "SONKU_P83_FIELD_NOTICE_HASH_MISMATCH:$($item.Key)" }
          }
          if (Test-Path -LiteralPath dist/Studio) { throw 'SONKU_FIELD_USER_DATA_MUST_NOT_SHIP' }
          Write-Host 'SONKU_P85_FIELD_READY: GUI EXE + verified MIT notice + FAT guide'
      - uses: actions/upload-artifact@v4
        name: Upload isolated SonKu Windows x64 field candidate
