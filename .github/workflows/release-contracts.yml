name: Smart Release/Download Contracts (fast only)
on:
  pull_request:
    paths:
      - 'LICENSE'
      - 'LICENSE-NOTICE.txt'
      - 'installer/ArSonMix.iss'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/verify_windows_spatial_fx_packaging.py'
      - 'scripts/verify_immersib_approved_pcm_sources.py'
      - 'config/immersib_approved_pcm_sources.json'
      - 'scripts/tests/test_windows_spatial_fx_packaging.py'
      - 'scripts/tests/test_immersib_approved_pcm_sources.py'
      - 'scripts/build_verify_windows_installer.ps1'
      - 'scripts/test_inno_graceful_update_windows.ps1'
      - 'tests/license_distribution_contract.test.mjs'
      - 'scripts/verify_embedded_legal.py'
      - 'web/approved-native-legal.js'
      - 'src/EmbeddedLegalResources.h'
      - 'src/Main.cpp'
      - 'scripts/build_approved_native_gui.py'
      - 'CMakeLists.txt'
      - 'site/index.html'
      - 'site/downloads.js'
      - 'scripts/build_release_catalog.py'
      - 'scripts/build_cloudflare_pages.py'
      - 'tests/test_cloudflare_pages_build.py'
      - 'scripts/verify_release_setup_zip.py'
      - 'tests/test_release_setup_zip.py'
      - 'scripts/release_ci_dispatch.mjs'
      - 'scripts/check_platform_portability.py'
      - 'scripts/package_native_linux.sh'
      - 'scripts/package_native_macos.sh'
      - 'tests/test_platform_portability.py'
      - 'tests/test_release_catalog.py'
      - 'tests/downloads_runtime_contract.test.mjs'
      - 'tests/landing_page_download_contract_test.py'
      - 'tests/release_ci_dispatch_contract.test.mjs'
      - 'scripts/release_trust_manifest.py'
      - 'tests/test_release_trust_manifest.py'
      - '.github/workflows/release-attestation-probe.yml'
      - '.github/workflows/release-control.yml'
      - '.github/workflows/alpha-preview-publish.yml'
      - '.github/workflows/crossplatform-native-qualification.yml'
      - '.github/workflows/release-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'LICENSE'
      - 'LICENSE-NOTICE.txt'
      - 'installer/ArSonMix.iss'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/verify_windows_spatial_fx_packaging.py'
      - 'scripts/verify_immersib_approved_pcm_sources.py'
      - 'config/immersib_approved_pcm_sources.json'
      - 'scripts/tests/test_windows_spatial_fx_packaging.py'
      - 'scripts/tests/test_immersib_approved_pcm_sources.py'
      - 'scripts/build_verify_windows_installer.ps1'
      - 'scripts/test_inno_graceful_update_windows.ps1'
      - 'tests/license_distribution_contract.test.mjs'
      - 'scripts/verify_embedded_legal.py'
      - 'web/approved-native-legal.js'
      - 'src/EmbeddedLegalResources.h'
      - 'src/Main.cpp'
      - 'scripts/build_approved_native_gui.py'
      - 'CMakeLists.txt'
      - 'scripts/build_release_catalog.py'
      - 'scripts/build_cloudflare_pages.py'
      - 'tests/test_cloudflare_pages_build.py'
      - 'scripts/verify_release_setup_zip.py'
      - 'tests/test_release_setup_zip.py'
      - 'scripts/release_ci_dispatch.mjs'
      - 'tests/test_release_catalog.py'
      - 'tests/downloads_runtime_contract.test.mjs'
      - 'tests/landing_page_download_contract_test.py'
      - 'tests/release_ci_dispatch_contract.test.mjs'
      - 'scripts/release_trust_manifest.py'
      - 'tests/test_release_trust_manifest.py'
      - '.github/workflows/release-attestation-probe.yml'
      - '.github/workflows/release-contracts.yml'

permissions:
  contents: read

concurrency:
  group: release-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: No native compiler; owner authorization, catalog integrity and YAML shape
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Release identity and browser contract
        run: |
          node --check site/downloads.js
          node --test tests/license_distribution_contract.test.mjs
          python scripts/verify_embedded_legal.py --self-test
          python -m unittest discover -s scripts/tests -p test_windows_spatial_fx_packaging.py -v
          python -m unittest discover -s scripts/tests -p test_immersib_approved_pcm_sources.py -v
          python scripts/verify_immersib_approved_pcm_sources.py
          node --check web/approved-native-legal.js
          node --test tests/downloads_runtime_contract.test.mjs
          node --check scripts/release_ci_dispatch.mjs
          node --test tests/release_ci_dispatch_contract.test.mjs
          python -m unittest discover -s tests -p test_release_trust_manifest.py -v
          python tests/test_release_catalog.py
          python tests/test_cloudflare_pages_build.py
          python tests/test_release_setup_zip.py
          python -m py_compile scripts/build_release_catalog.py scripts/build_cloudflare_pages.py scripts/check_platform_portability.py
          python tests/test_platform_portability.py
          bash -n scripts/package_native_linux.sh scripts/package_native_macos.sh
          ruby -e 'require "yaml"; ARGV.each { |p| YAML.load_file(p) }' .github/workflows/alpha-preview-publish.yml .github/workflows/release-control.yml .github/workflows/crossplatform-native-qualification.yml .github/workflows/pages-publish.yml
