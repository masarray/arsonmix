name: ImerSip one-shot checked-in RGBA PNG materialization
on:
  push:
    branches:
      - feat/imersip-on-sonku-p92-single-engine-20261116
    paths:
      - '.github/workflows/imersip-p92-materialize-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: imersip-png-commit
  cancel-in-progress: false
jobs:
  materialize:
    if: github.ref == 'refs/heads/feat/imersip-on-sonku-p92-single-engine-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/imersip-on-sonku-p92-single-engine-20261116
          fetch-depth: 1
      - name: Prepare reproducible image build dependencies
        run: python -m pip install --disable-pip-version-check "pillow>=11,<13" "numpy>=2,<3"
      - name: Produce and audit exact individual PNG source assets
        run: |
          set -euo pipefail
          python tests/imersip_p92_png_asset_test.py --out imersip-asset-output
          test "$(find imersip-asset-output/assets -name '*.png' -type f | wc -l)" -eq 19
          python - <<'PY'
          import json, pathlib
          j=json.loads(pathlib.Path('imersip-asset-output/asset_manifest.json').read_text())
          assert j['asset_count']==19
          assert j['coordinates']['editor']==[1100,680]
          PY
      - name: Commit only independent PNGs and verified manifest to this PR branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feat/imersip-on-sonku-p92-single-engine-20261116"
          mkdir -p assets/imersip/png
          cp imersip-asset-output/assets/*.png assets/imersip/png/
          cp imersip-asset-output/asset_manifest.json assets/imersip/asset_manifest.json
          git add assets/imersip/png/*.png assets/imersip/asset_manifest.json
          git diff --cached --name-only | grep -vE '^assets/imersip/(png/[^/]+\.png|asset_manifest\.json)$' && exit 1 || true
          if git diff --cached --quiet; then
            echo 'Exact asset package already committed'
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "feat(imersip): check in 19 audited full-resolution RGBA speaker and control PNGs [skip ci]"
            git push origin HEAD:refs/heads/feat/imersip-on-sonku-p92-single-engine-20261116
          fi
