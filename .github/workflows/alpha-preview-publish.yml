name: Publish verified ArSonMix Alpha Preview

# Owner-comment dispatch only; no build on release candidate branch push.
# No GitHub Release or tag is created unless every native and distribution gate passes.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        type: string
        required: true
        description: Approved immutable alpha or beta tag
      expected_sha:
        type: string
        required: true
        description: Approved 40-character candidate commit

permissions:
  contents: read

concurrency:
  group: alpha-preview-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  alpha:
    name: Windows x64 build and independently verify preview
    if: github.repository == 'masarray/arsonmix'
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false

      - name: Verify release identity and immutable source
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ($env:GITHUB_REF_NAME -split '/')[-1]
          if ($tag -ne $env:RELEASE_TAG -or $env:EXPECTED_SHA -notmatch '^[0-9a-f]{40}$') {
            throw "Release controller tag/SHA does not match branch and verified inputs"
          }
          if ($tag -cnotmatch '^v([0-9]+\.[0-9]+\.[0-9]+)-(alpha|beta)\.[0-9]+$') {
            throw "Release must use vX.Y.Z-alpha.N or vX.Y.Z-beta.N"
          }
          $version = $Matches[1]
          $stage = $Matches[2]
          if ($env:GITHUB_REF_NAME -cne "releases/$stage/$tag") {
            throw "Release branch must match the verified tag stage"
          }
          $cmake = Get-Content -LiteralPath CMakeLists.txt -Raw -Encoding UTF8
          if (-not $cmake.Contains("project(ARMixConsole VERSION $version LANGUAGES")) {
            throw "Pre-release version does not match native product version"
          }
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "Release notes missing: $notes"
          }
          $actual = (& git rev-parse HEAD).Trim()
          if ($env:GITHUB_SHA -ne $env:EXPECTED_SHA) { throw "Workflow source SHA mismatch" }
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SHA) {
            throw "Unpinned release checkout: expected=$env:EXPECTED_SHA got=$actual"
          }
          $remote = & git ls-remote origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0 -or -not $remote) {
            throw "Cannot establish authoritative release branch HEAD"
          }
          $remoteSha = ($remote -split '\s+')[0]
          if ($remoteSha -ne $actual) {
            throw "Stale release branch commit rejected: remote=$remoteSha checked-out=$actual"
          }
          $existingTag = & git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0 -or $existingTag) { throw "Release tag already exists or cannot be verified" }
          # A not-yet-published tag is HTTP 404, not a fatal native command
          # exit. Distinguish that from auth/rate/network failure. The older
          # gh release view probe leaked LASTEXITCODE=1 to the pwsh runner.
          $releaseUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $releaseProbe = Invoke-WebRequest -Method Get -Uri $releaseUri -SkipHttpErrorCheck -Headers @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          if ($releaseProbe.StatusCode -eq 200) {
            throw "Release already exists; do not rebuild or overwrite immutable assets"
          }
          if ($releaseProbe.StatusCode -ne 404) {
            throw "Release existence probe failed HTTP $($releaseProbe.StatusCode)"
          }
          "ARMIX_RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          "ARMIX_RELEASE_NOTES=$notes" >> $env:GITHUB_ENV
          Write-Host "ALPHA_RELEASE_EXACT_SOURCE=$actual"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Reject incomplete or extra alpha.33 FactoryFX before native build
        shell: pwsh
        run: |
          python scripts/factoryfx_release_bundle.py preflight --lock config/factoryfx-approved-releases.json --require three
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checkout pinned JUCE 8.0.15
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: 91ad83ae34a81e0833b1a2b0866f54846370ae53 # JUCE 8.0.15
          path: third_party/JUCE
          persist-credentials: false

      - name: Install pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure release application
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_ROOT="$env:GITHUB_WORKSPACE/third_party/JUCE" -DBUILD_TESTING=OFF -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE/.deps" -DARMIX_RELEASE_TAG="$env:ARMIX_RELEASE_TAG" -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON -DARMIX_SONKU_APPROVED_P99_MAIN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The official Windows prerelease MUST contain both public FX.
          $cache = @(Get-Content -LiteralPath build/CMakeCache.txt -Encoding UTF8)
          foreach ($entry in @('ARMIX_IMMERSIB_RELEASE_CANDIDATE:BOOL=ON',
                                'ARMIX_SONKU_APPROVED_P99_MAIN:BOOL=ON',
                                'ARMIX_IMMERSIB_STAGE_MONITOR_RESEARCH:BOOL=ON',
                                'ARMIX_IMMERSIB_MUSICAL_EQ_RESEARCH:BOOL=ON')) {
            if ($entry -notin $cache) { throw "PUBLIC_SPATIAL_FX_RELEASE_FLAG_MISSING: $entry" }
          }
          node scripts/check_approved_native_gui_release.mjs --source-only --bundle build/approved_gui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release application only
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixConsole
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package exact-SHA portable native mixer
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage all three independently approved FactoryFX (alpha.33)
        shell: pwsh
        run: |
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist --require three
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/factoryfx_release_bundle.py verify --lock config/factoryfx-approved-releases.json --output dist --require three
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Independently audit exact native executable and portable package
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path -LiteralPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build, install, upgrade and uninstall exact verified Windows installer
        shell: pwsh
        run: |
          & ./scripts/build_verify_windows_installer.ps1 -OutputDir dist -InstallerOutput installer-output -IncludePortableUpdater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create release assets with checksums
        shell: pwsh
        run: |
          $tag = $env:ARMIX_RELEASE_TAG
          New-Item -ItemType Directory -Force release | Out-Null
          $setup = 'installer-output/ArSonMix-Windows-x64-Setup-Preview.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) {
            throw "Missing independently verified installer"
          }
          $releasedExe = "release/ArSonMix-$tag-Windows-x64-Setup.exe"
          $releasedZip = "release/ArSonMix-$tag-Windows-x64-Setup.zip"
          Copy-Item -LiteralPath $setup -Destination $releasedExe
          # Public landing prefers this ZIP-wrapped installer. Keep the
          # direct EXE for compatibility. No silent change to its bytes.
          Compress-Archive -LiteralPath $releasedExe -DestinationPath $releasedZip -CompressionLevel Fastest
          python scripts/verify_release_setup_zip.py --exe $releasedExe --zip $releasedZip
          if ($LASTEXITCODE -ne 0) { throw "Installer ZIP failed byte-for-byte verification" }
          Compress-Archive -Path 'dist/*' -DestinationPath "release/ArSonMix-$tag-Windows-x64-Portable.zip" -CompressionLevel Fastest
          # Compare actual public ZIP (not only the temporary audit ZIP) to
          # every verified distribution file, including nested VST3 resources.
          . ./scripts/windows_zip_member_paths.ps1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $distRoot=(Resolve-Path -LiteralPath 'dist').Path
          $portableZip=[IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath "release/ArSonMix-$tag-Windows-x64-Portable.zip").Path)
          try{Assert-ArSonMixZipPayload $portableZip $distRoot}finally{$portableZip.Dispose()}

          Copy-Item -LiteralPath dist/BUILD_PROVENANCE.json -Destination release/BUILD_PROVENANCE.json
          Copy-Item -LiteralPath dist/FACTORYFX_STAGE_REPORT.json -Destination release/FACTORYFX_STAGE_REPORT.json
          Copy-Item -LiteralPath installer-output/INSTALLER_PROVENANCE.json -Destination release/INSTALLER_PROVENANCE.json
          $assets = @(Get-ChildItem -LiteralPath release -File | Where-Object { $_.Extension -in '.exe','.zip' })
          if ($assets.Count -ne 3) { throw "Verified installer EXE, identical installer ZIP and portable ZIP required" }
          $lines = foreach ($asset in $assets) {
            $digest = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$digest  $($asset.Name)"
          }
          Set-Content -LiteralPath release/SHA256SUMS.txt -Value $lines -Encoding ascii
          Write-Host "ALPHA_RELEASE_ARTIFACTS: $($assets.Name -join ', ')"

      - name: Create release trust manifest and portable file inventory
        shell: pwsh
        run: |
          python scripts/release_trust_manifest.py create --directory release --platform windows --tag $env:ARMIX_RELEASE_TAG --sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transfer verified candidate to isolated publisher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release-${{ inputs.expected_sha }}
          path: release/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Attest and publish exact Windows release (no compiler)
    needs: alpha
    if: github.repository == 'masarray/arsonmix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ inputs.expected_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release-${{ inputs.expected_sha }}
          path: release
      - name: Recheck trusted release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta)\.[0-9]+$ ]]
          stage="${BASH_REMATCH[1]}"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/releases/$stage/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git ls-remote origin "$GITHUB_REF" | cut -f1)" = "$SOURCE_SHA"
      - name: Validate transferred release manifest and every asset
        run: python3 scripts/release_trust_manifest.py verify --directory release --platform windows --tag "$RELEASE_TAG" --sha "$SOURCE_SHA"
      - name: Attest final release bytes and metadata
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'release/*'
      - name: Verify cryptographic publisher identity before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for asset in release/*; do
            gh attestation verify "$asset" --repo masarray/arsonmix --signer-workflow masarray/arsonmix/.github/workflows/alpha-preview-publish.yml --source-ref "$GITHUB_REF" --source-digest "$SOURCE_SHA" --signer-digest "$SOURCE_SHA" --deny-self-hosted-runners
          done
      - name: Publish verified GitHub prerelease and its Windows binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          & gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists; never replace immutable published assets"
          }
          $assets = @(Get-ChildItem -LiteralPath release -File | Sort-Object Name | ForEach-Object FullName)
          if ($assets.Count -ne 8) { throw "Unexpected release asset count: $($assets.Count)" }
          $remote = & git ls-remote origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0 -or -not $remote -or ($remote -split '\s+')[0] -ne $env:GITHUB_SHA) {
            throw "Release branch advanced during qualification; stale promotion rejected"
          }
          $existingTag = & git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}"
          if ($LASTEXITCODE -ne 0 -or $existingTag) { throw "Release tag already exists or cannot be verified" }
          # The owner dispatcher requires current main before scheduling.
          # Subsequent development can continue while this pinned SHA builds.
          $titleStage = if ($tag -cmatch '-beta\.') { "Public Beta" } else { "Alpha Preview" }
          & gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "ArSonMix $tag — $titleStage" --notes-file "docs/releases/$tag.md" --prerelease --latest=false --draft
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release draft upload failed" }
          python3 scripts/release_trust_manifest.py verify-upload --directory release --platform windows --tag $tag --sha $env:SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw "Draft asset integrity check failed; draft retained" }
          & gh release edit $tag --repo $env:GITHUB_REPOSITORY --draft=false
          if ($LASTEXITCODE -ne 0) { throw "Draft retained; publication failed. Inspect without overwriting assets." }
          & gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Refresh official landing catalog after publishing real verified binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & gh workflow run pages-publish.yml --repo $env:GITHUB_REPOSITORY --ref main
          if ($LASTEXITCODE -ne 0) { throw "Release published but landing sync dispatch failed" }
          Write-Host "ARSONMIX_LANDING_CATALOG_REFRESH_DISPATCHED"

      # GitHub's GITHUB_TOKEN release event does not automatically trigger
      # Cloudflare's Git-connected Pages build. An optional production Deploy
      # Hook provides the same no-code-release catalog refresh as GitHub Pages.
      # No hook secret => no external mutation; browser still checks official
      # GitHub Releases without accepting unverified assets.
      - name: Refresh Cloudflare Pages after verified public release
        shell: pwsh
        env:
          CF_PAGES_DEPLOY_HOOK: ${{ secrets.ARSONMIX_CLOUDFLARE_PAGES_DEPLOY_HOOK }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CF_PAGES_DEPLOY_HOOK)) {
            Write-Warning "CLOUDFLARE_PAGES_DEPLOY_HOOK_NOT_CONFIGURED; static catalog will update at next verified main push"
            exit 0
          }
          $uri = $null
          $valid = [System.Uri]::TryCreate(
            $env:CF_PAGES_DEPLOY_HOOK.Trim(), [System.UriKind]::Absolute, [ref]$uri
          )
          if (-not $valid -or $uri.Scheme -ne "https" -or
              $uri.Host -ne "api.cloudflare.com" -or
              $uri.AbsolutePath -notmatch '^/client/v4/pages/webhooks/deploy_hooks/[A-Za-z0-9_-]+$' -or
              $uri.Query -or $uri.Fragment -or $uri.UserInfo) {
            Write-Warning "CLOUDFLARE_PAGES_DEPLOY_HOOK_INVALID; no request performed"
            exit 0
          }
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              $response = Invoke-WebRequest -Method Post -Uri $uri -TimeoutSec 20 -ErrorAction Stop
              if ($response.StatusCode -lt 200 -or $response.StatusCode -ge 300) {
                throw "Non-success HTTP response"
              }
              Write-Host "CLOUDFLARE_PAGES_REDEPLOY_ACCEPTED"
              break
            } catch {
              # Never log or echo the secret URL. Publication is already
              # complete; a CDN outage must not relabel the release as failed.
              if ($attempt -eq 3) {
                Write-Warning "CLOUDFLARE_PAGES_DEPLOY_HOOK_FAILED; keep prior static deploy and use official live release fallback"
              } else {
                Start-Sleep -Seconds (2 * $attempt)
              }
            }
          }
