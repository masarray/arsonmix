name: DMX native wet return (scoped Windows)
on:
  pull_request:
    paths:
      - 'engine/core/LiveChannelFxGraph.h'
      - 'engine/core/RealtimeNativeFxControl.h'
      - 'engine/builtin_fx/VocalReverbProcessor.h'
      - 'engine/builtin_fx/VocalReverbEditor.h'
      - 'src/NativeBuiltInFx.h'
      - 'tests/native_vocal_reverb_test.cpp'
      - '.github/workflows/dmx-native-wet-return.yml'
permissions:
  contents: read
concurrency:
  group: dmx-wet-native-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  native-return:
    if: github.head_ref == 'feature/dual-mix-experience-20261126'
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile real registry, return lease, editor and graph
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (!$vs) { throw 'MSVC_NOT_FOUND' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          if ((& git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) { throw 'DMX_SOURCE_MISMATCH' }
          cmake -S . -B dmx-build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DJUCE_ROOT=$env:GITHUB_WORKSPACE/third_party/JUCE" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:GITHUB_WORKSPACE/.deps" -DBUILD_TESTING=ON -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON -DARMIX_SONKU_APPROVED_P99_MAIN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build dmx-build --parallel 2 --target ARMixNativeVocalReverbTests ARMixNativeFxExtensionTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir dmx-build --output-on-failure --no-tests=error -R '^(NativeVocalReverbSourcePCMParameterAckAndState|M4NativeFxCatalogExtensionAndStatePreparation)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build dmx-build --parallel 2 --target CMakeFiles/ARMixConsole.dir/src/Main.cpp.obj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "DMX_SCOPED_NATIVE_PASS exact=$env:EXPECTED_SHA (not full FAT)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dmx-native-ctest
          path: dmx-build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
