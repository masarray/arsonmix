name: Publish ArSonMix GUI (main dispatcher)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["UI smoke (Chromium)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arsonmix-production-pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.guard.outputs.fresh }}
    steps:
      - name: Checkout exact qualified main GUI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
      - name: Skip superseded Pages builds
        id: guard
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$SOURCE_SHA" = "$CURRENT_MAIN" ]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping obsolete qualified Pages SHA $SOURCE_SHA; main is $CURRENT_MAIN"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        with:
          python-version: '3.12'
      - name: Build static landing and approved mixer preview
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          node --check web/app.js
          python tests/gui_baseline_lock_test.py
          python scripts/build_pages.py --out dist-pages --sha "$SOURCE_SHA" --branch main
          if grep -q '"REFERENCE_WORKFLOW_QA_ONLY"' site/preview/candidate.json 2>/dev/null; then
            cmp site/preview-v2/index.html dist-pages/preview/mixer.html
          elif [ -f site/preview/candidate.json ]; then
            cmp site/preview/mixer.html dist-pages/preview/mixer.html
          else
            cmp AR-MIX-Live-FX-Host-Standalone-v0.3.html dist-pages/preview/mixer.html
          fi
          python tests/button_asset_test.py
          python tests/fader_asset_test.py
          python tests/pan_button_asset_test.py
      - name: Configure GitHub Pages
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        uses: actions/configure-pages@v5
      - name: Upload site bundle
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    if: ${{ needs.build.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site from main
        id: deployment
        uses: actions/deploy-pages@v4
