name: Publish ArSonMix GUI (main dispatcher)

on:
  # Landing-only changes have a separate, fail-closed browser gate. The mixer
  # itself continues to require the existing full Chromium workflow_run.
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/googlec34c43149eef6100.html'
      - 'site/landing.css'
      - 'site/downloads.js'
      - 'site/media/**'
      - 'scripts/build_landing_assets.py'
      - 'scripts/build_pages.py'
      - 'scripts/build_release_catalog.py'
      - 'tests/test_release_catalog.py'
      - '.github/workflows/pages-publish.yml'
      # Release-publisher permission + its exact regression can refresh catalog
      # after an already-published, validated binary without a Windows rebuild.
      - '.github/workflows/alpha-preview-publish.yml'
      - 'tests/release_ci_dispatch_contract.test.mjs'
  workflow_dispatch:
  # Owner-published releases also sync Pages. Releases made by GITHUB_TOKEN
  # explicitly dispatch this workflow after upload (GitHub event limitation).
  release:
    types: [published]
  workflow_run:
    workflows: ["UI smoke (Chromium)"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: arsonmix-production-pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      fresh: ${{ steps.guard.outputs.fresh }}
    steps:
      - name: Checkout exact qualified main GUI revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}
          persist-credentials: false
          fetch-depth: 2 # Compare the exact main commit to its first parent without full history.
      - name: Skip superseded Pages builds
        id: guard
        shell: bash
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          CURRENT_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$SOURCE_SHA" != "$CURRENT_MAIN" ]; then
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Skipping obsolete qualified Pages SHA $SOURCE_SHA; main is $CURRENT_MAIN"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            # Marketing only: any mixer, engine, preview/DOM/CSS/build change
            # immediately fails closed to the full Chromium workflow_run gate.
            CHANGES="$(git diff --name-only HEAD^ HEAD)"
            if [ -z "$CHANGES" ]; then
              echo "fresh=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            while IFS= read -r path; do
              case "$path" in
                README.md|site/index.html|site/googlec34c43149eef6100.html|site/landing.css|site/downloads.js|site/media/*|scripts/build_landing_assets.py|scripts/build_release_catalog.py|scripts/capture_landing_screenshots.py|tests/landing_page_*|tests/downloads_runtime_contract.test.mjs|tests/test_release_catalog.py|.github/workflows/pages-publish.yml|.github/workflows/alpha-preview-publish.yml|tests/release_ci_dispatch_contract.test.mjs)
                  ;;
                *)
                  echo "fresh=false" >> "$GITHUB_OUTPUT"
                  echo "NOT LANDING ONLY: $path requires full /preview/ qualification"
                  exit 0
                  ;;
              esac
            done <<< "$CHANGES"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Scoped landing-only changes validated against first-parent diff"
          else
            # On the latest qualified main, always publish the assembled /preview/;
            # a preceding GUI commit may have been followed by docs/CI commits.
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages and resolve canonical site URL
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static landing, verified release catalog and approved mixer preview
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARSONMIX_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          node --check web/app.js
          python tests/gui_baseline_lock_test.py
          python scripts/build_pages.py --out dist-pages --sha "$SOURCE_SHA" --branch main
          test "$(cat dist-pages/googlec34c43149eef6100.html)" = "google-site-verification: googlec34c43149eef6100.html"
          python scripts/build_landing_assets.py dist-pages
          python tests/test_release_catalog.py
          python scripts/build_release_catalog.py --output dist-pages/release-catalog.json
          # The ONLY public mixer is /preview/, generated with the approved
          # PNG controls. Old links redirect to it; they never show other GUI.
          python tests/single_preview_publication_contract_test.py dist-pages
          python tests/landing_page_download_contract_test.py dist-pages
          python tests/test_pages_public_origin.py dist-pages
          python -m py_compile scripts/build_landing_assets.py tests/landing_page_browser_smoke.py
          python tests/button_asset_test.py
          python tests/fader_asset_test.py
          python tests/pan_button_asset_test.py
      - name: Browser-qualify landing-only release at desktop and mobile
        if: ${{ steps.guard.outputs.fresh == 'true' && github.event_name == 'push' }}
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/landing_page_browser_smoke.py
      - name: Upload site bundle
        if: ${{ steps.guard.outputs.fresh == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    if: ${{ needs.build.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site from main
        id: deployment
        uses: actions/deploy-pages@v4
