name: Vocal Harmony plugin DSP (scoped)
# Only code/tests of the built-in Vocal Harmony FX may start this workflow.
# In particular, shared CMakeLists.txt, Player, mixer, generic GUI and CI
# maintenance must never trigger an unrelated Vocal Harmony failure.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'engine/builtin_fx/Harmony*.h'
      - 'engine/builtin_fx/ChannelHarmonyProcessor.h'
      - 'tests/harmony*.cpp'
      - 'tools/harmony_offline_ab.cpp'
      - 'site/preview-v2/assets/mixer-native-harmony.js'
      - 'tests/native_harmony_assembly_test.py'
      - 'tests/approved_native_harmony_smoke.py'
permissions:
  contents: read
concurrency:
  group: harmony-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scope:
    name: Check Vocal Harmony files changed in this PR update
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      dsp: ${{ steps.scope.outputs.dsp }}
      ui: ${{ steps.scope.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
      - name: Classify only actual Vocal Harmony source changes
        id: scope
        shell: bash
        env:
          PR_ACTION: ${{ github.event.action }}
          PR_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # GitHub 'paths' looks at the entire PR diff. If a mixed PR
          # changes unrelated files later, do not re-run the plugin DSP.
          # Prefer the exact synchronize-before SHA to handle multi-commit
          # pushes; on missing/unfetchable evidence, fail OPEN for safety.
          BASE="$PR_BASE"
          if [[ "$PR_ACTION" == "synchronize" && "$PR_BEFORE" =~ ^[a-fA-F0-9]{40}$ && ! "$PR_BEFORE" =~ ^0+$ ]]; then
            BASE="$PR_BEFORE"
          fi
          if [[ ! "$BASE" =~ ^[a-fA-F0-9]{40}$ ]]; then
            printf 'dsp=true\nui=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git fetch --no-tags --depth=1 origin "$BASE"; then
              printf 'dsp=true\nui=true\n' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/vocal-harmony-diff.txt"; then
            printf 'dsp=true\nui=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/vocal_harmony_ci_scope.mjs < "$RUNNER_TEMP/vocal-harmony-diff.txt" >> "$GITHUB_OUTPUT"
          echo "VOCAL_HARMONY_CHANGED_FILES:"
          cat "$RUNNER_TEMP/vocal-harmony-diff.txt"
  harmony-cpp:
    name: Native DSP compile and PCM regression (Linux, no JUCE)
    needs: scope
    if: ${{ needs.scope.outputs.dsp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Build and run synchronous vocal fixture
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra tests/harmony_pitch_synchronous_test.cpp -o /tmp/arson-harmony-psola
          /tmp/arson-harmony-psola
      - name: Compile and run complete engine dry, pitch, stereo and graph-independent PCM fixtures
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra tests/harmony_dsp_test.cpp -o /tmp/arson-harmony-engine
          /tmp/arson-harmony-engine
      - name: Verify stage separation, mono and exact PCM
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra tests/harmony_stage_spatial_test.cpp -o /tmp/arson-harmony-spatial
          /tmp/arson-harmony-spatial
      - name: Compile and exercise native offline listening A/B renderer
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra tools/harmony_offline_ab.cpp -o /tmp/arson-harmony-ab
          /tmp/arson-harmony-ab --self-test
  harmony-ui:
    name: Vocal Harmony editor syntax and approved UI contract (no Chromium)
    needs: scope
    if: ${{ needs.scope.outputs.ui == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Plugin editor JS and native bridge/ACK contract
        run: |
          node --check site/preview-v2/assets/mixer-native-harmony.js
          python tests/native_harmony_assembly_test.py
