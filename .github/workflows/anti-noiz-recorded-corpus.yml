name: Anti Noiz recorded environment paired qualification
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'tools/anti-noiz/recorded_environment.py'
      - 'tools/anti-noiz/recorded_field_wind.py'
      - 'tools/anti-noiz/compare_p0_controls.py'
      - 'tools/anti-noiz/raw_wind_intake.py'
      - 'tools/anti-noiz/recorded_raw_wind.py'
      - 'tools/anti-noiz/corpus_qualifier.cpp'
      - 'tools/anti-noiz/compare_environment.py'
      - 'tools/anti-noiz/tonal_benchmark.cpp'
      - 'tools/anti-noiz/compare_tonal.py'
      - 'tools/anti-noiz/harmonic_benchmark.cpp'
      - 'tools/anti-noiz/compare_harmonic.py'
      - 'tools/anti-noiz/spectral_diagnostics.py'
      - 'engine/builtin_fx/anti_noiz/**'
      - '.github/workflows/anti-noiz-recorded-corpus.yml'
permissions:
  contents: read
concurrency:
  group: anti-noiz-real-corpus-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Build existing offline native Core qualifier
        run: |
          cmake -S tools/anti-noiz -B "$RUNNER_TEMP/an07" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/an07" --parallel 2 --target anti_noiz_qualify
          "$RUNNER_TEMP/an07/anti_noiz_qualify" --self-test
          python3 tools/anti-noiz/recorded_environment.py --self-test
      - name: Pinned real recorded environments (not listening approval)
        run: python3 tools/anti-noiz/recorded_environment.py "$RUNNER_TEMP/an07/anti_noiz_qualify" "$RUNNER_TEMP/an07-evidence"
      - name: Checkout frozen AN-08C.1 comparator
        uses: actions/checkout@v4
        with:
          ref: 9f87fd8430c572ac118e8d5e6710c77cbc0379bb
          path: an07-baseline
          persist-credentials: false
      - name: Run exact baseline against same recorded corpus
        run: |
          cmake -S an07-baseline/tools/anti-noiz -B "$RUNNER_TEMP/an07-base" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/an07-base" --parallel 2 --target anti_noiz_qualify
          python3 tools/anti-noiz/recorded_environment.py "$RUNNER_TEMP/an07-base/anti_noiz_qualify" "$RUNNER_TEMP/an07-base-evidence"
      - name: Compare paired quality metrics without weakening original gates
        run: python3 tools/anti-noiz/compare_environment.py "$RUNNER_TEMP/an07-base-evidence/report.json" "$RUNNER_TEMP/an07-evidence/report.json" "$RUNNER_TEMP/an07-comparison.json"
      - name: Preserve 40 single-line cases against exact C.1
        if: ${{ always() && hashFiles('an07-baseline/tools/anti-noiz/OfflineAudio.h') != '' }}
        run: |
          cp tools/anti-noiz/tonal_benchmark.cpp an07-baseline/tools/anti-noiz/tonal_benchmark.cpp
          g++ -std=c++20 -O3 -Wall -Wextra -Werror tools/anti-noiz/tonal_benchmark.cpp -o "$RUNNER_TEMP/an08a-candidate"
          g++ -std=c++20 -O3 -Wall -Wextra -Werror an07-baseline/tools/anti-noiz/tonal_benchmark.cpp -o "$RUNNER_TEMP/an08a-baseline"
          "$RUNNER_TEMP/an08a-candidate" > "$RUNNER_TEMP/an08a-candidate.csv"
          "$RUNNER_TEMP/an08a-baseline" > "$RUNNER_TEMP/an08a-baseline.csv"
          python3 tools/anti-noiz/compare_tonal.py "$RUNNER_TEMP/an08a-baseline.csv" "$RUNNER_TEMP/an08a-candidate.csv" "$RUNNER_TEMP/an08a-tonal.json"
      - name: Matched harmonic stack and per-line guard
        if: ${{ always() && hashFiles('an07-baseline/tools/anti-noiz/OfflineAudio.h') != '' }}
        run: |
          cp tools/anti-noiz/harmonic_benchmark.cpp an07-baseline/tools/anti-noiz/harmonic_benchmark.cpp
          g++ -std=c++20 -O3 -Wall -Wextra -Werror tools/anti-noiz/harmonic_benchmark.cpp -o "$RUNNER_TEMP/an08c-candidate"
          g++ -std=c++20 -O3 -Wall -Wextra -Werror an07-baseline/tools/anti-noiz/harmonic_benchmark.cpp -o "$RUNNER_TEMP/an08c-baseline"
          "$RUNNER_TEMP/an08c-candidate" > "$RUNNER_TEMP/an08c-candidate.csv"
          "$RUNNER_TEMP/an08c-baseline" > "$RUNNER_TEMP/an08c-baseline.csv"
          python3 tools/anti-noiz/compare_harmonic.py "$RUNNER_TEMP/an08c-baseline.csv" "$RUNNER_TEMP/an08c-candidate.csv" "$RUNNER_TEMP/an08c-harmonic.json"
      - name: Preserve machine-readable evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-noiz-an07-recorded-environment-report
          path: |
            ${{ runner.temp }}/an07-evidence/report.json
            ${{ runner.temp }}/an07-base-evidence/report.json
            ${{ runner.temp }}/an07-comparison.json
            ${{ runner.temp }}/an08a-baseline.csv
            ${{ runner.temp }}/an08a-candidate.csv
            ${{ runner.temp }}/an08a-tonal.json
            ${{ runner.temp }}/an08c-baseline.csv
            ${{ runner.temp }}/an08c-candidate.csv
            ${{ runner.temp }}/an08c-harmonic.json
            ${{ runner.temp }}/an07-evidence/*/provenance.tsv
            ${{ runner.temp }}/an07-evidence/*/segments.tsv
          if-no-files-found: warn

  field-wind:
    name: Field wind paired PCM and exposed-noise gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b2800799cffe85c9ec7d2e1addad3dce22627c6a
          path: field-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 20172fb40f9d1ed8765761a6f7fad77c79d8df02
          path: residual-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 54af7eea34b264e03f123302051aaf5d2ebf61c8
          path: active-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 14c87a874e615350f5cf5cdf149dc4848f084a9a
          path: shape-reference
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1a10819afb7d2eb4ebf9ad22eea707668923219d
          path: controls-reference
          persist-credentials: false
      - name: Build exact field baseline and candidate
        id: field_build
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror field-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/field-old"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/field-new"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror residual-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/field-prior"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror active-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/field-pre-active"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror shape-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/field-pre-shape"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror tools/anti-noiz/reference_mask_probe.cpp -o "$RUNNER_TEMP/reference-mask"
          "$RUNNER_TEMP/reference-mask" --self-test
          "$RUNNER_TEMP/reference-mask" --rumble-probe > "$RUNNER_TEMP/reference-mask-rumble.csv"
          python3 tools/anti-noiz/recorded_field_wind.py --self-test
      - name: Measure paired real breeze and preserve foreground
        run: python3 tools/anti-noiz/recorded_field_wind.py "$RUNNER_TEMP/field-old" "$RUNNER_TEMP/field-new" "$RUNNER_TEMP/field-wind" --prior "$RUNNER_TEMP/field-prior" --pre-active "$RUNNER_TEMP/field-pre-active" --pre-shape "$RUNNER_TEMP/field-pre-shape" --reference-probe "$RUNNER_TEMP/reference-mask"
      - name: Strict arithmetic control independence and historical parity
        if: ${{ !cancelled() && steps.field_build.outcome == 'success' }}
        run: |
          # Additional exact comparison; do not replace or waive the original
          # default-compiler field gate. The same explicit FP contract applies
          # to all four independently built reference executables.
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off controls-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/controls-old"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/controls-new"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off residual-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/strict-prior"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror -ffp-contract=off active-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/strict-fastpath"
          python3 tools/anti-noiz/compare_p0_controls.py "$RUNNER_TEMP/field-wind" "$RUNNER_TEMP/controls-old" "$RUNNER_TEMP/controls-new" "$RUNNER_TEMP/strict-prior" "$RUNNER_TEMP/strict-fastpath"
      - name: Preserve unnormalized A/B and machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-noiz-field-wind-ab
          path: |
            ${{ runner.temp }}/field-wind/report.json
            ${{ runner.temp }}/field-wind/controls-report.json
            ${{ runner.temp }}/field-wind/*/controls-*-residual-only-processed.wav
            ${{ runner.temp }}/reference-mask-rumble.csv
            ${{ runner.temp }}/field-wind/*/reference-mask-*.csv
            ${{ runner.temp }}/field-wind/*/pre-shape-max-processed.wav
            ${{ runner.temp }}/field-wind/*/provenance.tsv
            ${{ runner.temp }}/field-wind/*/segments.tsv
            ${{ runner.temp }}/field-wind/*/old-max-input.wav
            ${{ runner.temp }}/field-wind/*/old-max-processed.wav
            ${{ runner.temp }}/field-wind/*/new-max-processed.wav
            ${{ runner.temp }}/field-wind/*/prior-max-processed.wav
            ${{ runner.temp }}/field-wind/*/pre-active-max-processed.wav
            ${{ runner.temp }}/field-wind/*/pre-active-spectral-processed.wav
            ${{ runner.temp }}/field-wind/*/prior-spectral-processed.wav
            ${{ runner.temp }}/field-wind/*/new-spectral-processed.wav
            ${{ runner.temp }}/field-wind/*/clean.wav
            ${{ runner.temp }}/field-wind/*/learn.wav
            ${{ runner.temp }}/field-wind/*/noise.wav
          if-no-files-found: warn

  raw-mic-wind:
    name: Pinned RWTH microphone wind objective qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: b2800799cffe85c9ec7d2e1addad3dce22627c6a
          path: raw-field-reference
          persist-credentials: false
      - name: Self-test intake and resampling
        run: |
          python3 tools/anti-noiz/raw_wind_intake.py --self-test
          python3 tools/anti-noiz/recorded_raw_wind.py --self-test
      - name: Acquire SHA256-pinned archive and record unique source hashes
        run: python3 tools/anti-noiz/raw_wind_intake.py "$RUNNER_TEMP/raw-wind-intake"
      - name: Build exact native baseline and candidate
        run: |
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror raw-field-reference/tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/raw-field-old"
          g++ -std=c++20 -O3 -DNDEBUG -Wall -Wextra -Werror tools/anti-noiz/corpus_qualifier.cpp -o "$RUNNER_TEMP/raw-field-new"
      - name: Run pinned raw microphone wind objective gate
        run: python3 tools/anti-noiz/recorded_raw_wind.py "$RUNNER_TEMP/raw-wind-intake" "$RUNNER_TEMP/raw-field-old" "$RUNNER_TEMP/raw-field-new" "$RUNNER_TEMP/raw-wind-report"
      - name: Preserve actual selected source bytes, licenses and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anti-noiz-raw-mic-wind-discovery
          path: |
            ${{ runner.temp }}/raw-wind-intake/manifest.json
            ${{ runner.temp }}/raw-wind-intake/LICENSE-*.txt
            ${{ runner.temp }}/raw-wind-intake/*.wav
            ${{ runner.temp }}/raw-wind-report/report.json
            ${{ runner.temp }}/raw-wind-report/*/provenance.tsv
            ${{ runner.temp }}/raw-wind-report/*/segments.tsv
            ${{ runner.temp }}/raw-wind-report/*/clean.wav
            ${{ runner.temp }}/raw-wind-report/*/learn.wav
            ${{ runner.temp }}/raw-wind-report/*/noise.wav
            ${{ runner.temp }}/raw-wind-report/*/new-max-processed.wav
            ${{ runner.temp }}/raw-wind-report/*/old-max-processed.wav
          if-no-files-found: warn
