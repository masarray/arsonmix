name: Publish GUI preview to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/fader-thumb-symmetry-polish
    paths:
      - 'site/**'
      - 'web/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site from exact mixer HTML source
        run: python scripts/build_pages.py --out dist-pages --sha "${GITHUB_SHA}" --branch "${GITHUB_REF_NAME}"
      - name: Check complete static site before publication
        run: |
          python -c "from pathlib import Path; p=Path('dist-pages'); assert (p/'index.html').exists(); assert (p/'preview/index.html').exists(); assert (p/'preview/mixer.html').exists(); assert (p/'preview/build.json').exists()"
          cmp AR-MIX-Live-FX-Host-Standalone-v0.3.html dist-pages/preview/mixer.html
      - name: Prepare GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - id: publish
        uses: actions/deploy-pages@v4
