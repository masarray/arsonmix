name: Vocal Reverb authentic JUCE editor screenshot (targeted Windows)
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'tests/native_vocal_reverb_test.cpp'
      - 'engine/builtin_fx/VocalReverbEditor.h'
      - 'engine/builtin_fx/VocalReverbProcessor.h'
      - '.github/workflows/vocal-reverb-screenshot.yml'

permissions:
  contents: read

# One dedicated screenshot proof: not a nativeFull gate, ASIO test,
# installer build or substitute for human viewing of the saved PNG.
concurrency:
  group: vocal-reverb-native-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screenshot:
    name: Targeted Windows MSVC + real JUCE PNG (not full FAT)
    if: ${{ github.head_ref == 'feat/native-vocal-reverb-research-20261123' }}
    runs-on: windows-2022
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify immutable PR head
        shell: pwsh
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          $head = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:EXPECTED) {
            throw "REVERB_NATIVE_SCREENSHOT_SOURCE_MISMATCH expected=$env:EXPECTED got=$head"
          }
      - name: Checkout pinned JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Install WebView2 headers for common native CMake
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows JUCE native DSP screenshot test
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_ROOT="${{ github.workspace }}/third_party/JUCE" `
            -DBUILD_TESTING=ON `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/.deps"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build focused real editor+DSP CTest (not mixer or installer)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixNativeVocalReverbTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Assert native 100% and 150% screenshots were rendered
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure -R '^NativeVocalReverbSourcePCMParameterAckAndState$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($f in @('build/ArSonMix_Vocal_Reverb_Native_MIX_100.png',
                            'build/ArSonMix_Vocal_Reverb_Native_MOTION_150.png')) {
            if (!(Test-Path $f)) { throw "REVERB_NATIVE_PNG_MISSING $f" }
            if ((Get-Item $f).Length -lt 10000) { throw "REVERB_NATIVE_PNG_TOO_SMALL $f" }
            Write-Host "NATIVE_JUCE_REAL_RENDER_PNG=$f"
          }
      - name: Upload user-viewable authentic JUCE screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-Vocal-Reverb-Real-JUCE-PNG-${{ github.event.pull_request.head.sha }}
          path: build/ArSonMix_Vocal_Reverb_Native_*.png
          if-no-files-found: ignore
          retention-days: 14
