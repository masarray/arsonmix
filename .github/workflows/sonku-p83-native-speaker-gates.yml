name: SonKu P8.3 native physical speaker research PCM
on:
  pull_request:
    paths:
      - 'engine/builtin_fx/sonku/SonKuSpatialCore.h'
      - 'engine/builtin_fx/sonku/SonKuEarlyReflections.h'
      - 'engine/builtin_fx/sonku/SonKuP83SpeakerScene.h'
      - 'engine/builtin_fx/sonku/SonKuP83LowFrequencyTransfer.h'
      - 'tests/sonku_p83_*'
      - '.github/workflows/sonku-p83-native-speaker-gates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sonku-p83-physical-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-source:
    name: Native C++ P8.3 source, PCM/stems/no-null and Music Bed invariants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run original SonKu native source
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=(-std=c++20 -O2 -Wall -Wextra -Werror -pedantic
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1
            -DSONKU_P72_NATIVE_XYZ_RT=1
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1)
          g++ "${FLAGS[@]}" -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            tests/sonku_p83_physical_speaker_source_test.cpp -o /tmp/p83-native
          /tmp/p83-native --wavdir sonku-p83-native-pcm | tee /tmp/p83-native.log
          grep -q '^PASS P8.3 SOURCE GATES:' /tmp/p83-native.log
          g++ "${FLAGS[@]}" tests/sonku_p83_externalization_gap_diagnostic.cpp \
            -o /tmp/p82-gap
          /tmp/p82-gap | tee /tmp/p82-gap.log
          grep -q '^PASS P8.3 DIAGNOSTIC:' /tmp/p82-gap.log

      - name: Cross-build exact Music Bed P8.2 raw PCM unchanged by opt-in P8.3 compilation
        shell: bash
        run: |
          set -euo pipefail
          FLAGS=(-std=c++20 -O2 -Wall -Wextra -Werror -pedantic
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1
            -DSONKU_P72_NATIVE_XYZ_RT=1
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1)
          g++ "${FLAGS[@]}" tests/sonku_p83_music_bed_byte_parity.cpp -o /tmp/p82-golden
          g++ "${FLAGS[@]}" -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            tests/sonku_p83_music_bed_byte_parity.cpp -o /tmp/p83-default
          /tmp/p82-golden /tmp/p82-golden.raw
          /tmp/p83-default /tmp/p83-default.raw
          cmp /tmp/p82-golden.raw /tmp/p83-default.raw
          sha256sum /tmp/p82-golden.raw /tmp/p83-default.raw
      - name: Hosted CPU evidence 44.1/48k 64/128/256 1/2/4 inserts (NOT ASIO)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            tests/sonku_p83_hosted_cpu_benchmark.cpp -o /tmp/p83-bench
          /tmp/p83-bench | tee /tmp/p83-bench.log
          grep -q '^P83_HOSTED_CPU,mode=P83' /tmp/p83-bench.log
      - name: Strict multi-band music + LF gate - reject cancellation or overboost
        shell: bash
        run: |
          set -euo pipefail
          awk -F, '
            /^P83_SPECTRAL,MUSIC_LF_ANTIPHASE,48000,frequency=83Hz/ {split($5,a,"="); bass=a[2]}
            /^P83_SPECTRAL,MUSIC_LF_ANTIPHASE,48000,frequency=1703Hz/ {split($5,a,"="); mid=a[2]}
            END {
              if (bass=="" || mid=="") {print "FAIL P83 MUSIC: missing source spectra"; exit 2}
              diff=bass-mid
              printf "P83_MUSIC_GATE,48000,83Hz_minus_1703Hz_relative_to_P82=%.3f dB,minimum=-6 dB\n",diff
              if(diff < -6) {print "FAIL P83 MUSIC: opt-in LF safeguard still loses bass"; exit 1}
              print "PASS P83 MUSIC: opt-in LF guard source fidelity; listening still pending"
            }
          ' /tmp/p83-native.log
          grep -q '^PASS P8.3 MULTIBAND FIDELITY:' /tmp/p83-native.log
      - name: Upload exact-source offline research PCM (not human FAT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonku-p83-source-pcm-${{ github.sha }}
          path: sonku-p83-native-pcm/*.wav
          retention-days: 14
