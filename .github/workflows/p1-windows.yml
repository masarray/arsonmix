name: Windows Native VST3 Host
on:
  push:
    branches: [ main, feature/p1-first-sound-windows, feature/p2-native-vst-catalog-fx-rack, feature/p2-daw-workflow-progress, fix/p2-native-output-monitor-diagnostics, fix/p2-realtime-glitch-telemetry-latest-gui, fix/p2-truthful-meter-pan-fx-toggle, feature/p2-native-state-presets, fix/p2-fabfilter-add-workflow, feature/p25-live-preset-graph-swap, integration/p25-gui-engine-reconciled, integration/main-v08-gui-p25-native ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-vst3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Checkout JUCE 8 pinned
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
      - name: Install WebView2 SDK for JUCE
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
      - name: Validate native UI JavaScript
        shell: pwsh
        run: |
          # Do not hide earlier Node failures with the exit code of the LAST
          # command. One Node invocation also avoids repeated startup costs.
          foreach ($file in @('web/bridge.js', 'web/monitor.js', 'web/app.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $contracts = @(
            'tests/gui_workflow_contract_test.mjs'
            'tests/native_ui_contract_test.mjs'
            'tests/native_preset_contract_test.mjs'
            'tests/fx_add_contract_test.mjs'
            'tests/live_graph_contract_test.mjs'
            'tests/reconciled_gui_engine_contract_test.mjs'
            'tests/main_v08_native_integration_test.mjs'
            'tests/smart_audio_ard_contract_test.mjs'
            'tests/p0_diagnostic_contract_test.mjs'
            'tests/smart_audio_diagnostic_contract_test.mjs'
            'tests/independent_clock_adapter_contract_test.mjs'
            'tests/direct_restore_recovery_contract_test.mjs'
            'tests/native_artifact_packaging_contract_test.mjs'
            'tests/portable_workspace_contract_test.mjs'
            'tests/plugin_vault_contract_test.mjs'
          )
          node --test $contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows x64
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DJUCE_ROOT="${{ github.workspace }}/third_party/JUCE"
          -DBUILD_TESTING=ON
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/.deps"
      - name: Build executable and native RT tests
        run: cmake --build build --config Release --target ARMixConsole ARMixMixerRoutingTests ARMixChannelRoutingContractTests ARMixPreparedBusGraphTests ARMixWorkspaceTests ARMixVaultTests ARMixOrbitPhaseTests ARMixOrbitControlTests ARMixOrbitMotionTests ARMixOrbitDistanceTests ARMixDearVrPolarPolicyTests ARMixRTTests ARMixPresetTests ARMixDiagnosticTests ARMixClockBridgeTests ARMixVirtualClockSoakTests ARMixCadenceTests ARMixCrackleWindowTests ARMixHealthTests ARMixPolicyTests ARMixPeriodEvidenceTests ARMixLifecycleTests ARMixWasapiProbeTests ARMixDualJuceTests ARMixClockSizingTests ARMixIndependentFormatTests ARMixRecoveryTests ARMixStreamWatchdogTests ARMixBridgeContinuityTests ARMixEndpointPolicyTests ARMixEndpointGuardTests ARMixAsioPolicyTests ARMixAsioBackendTests ARMixAsioRegistryIdentityTests ARMixDirectFenceTests --parallel 2
      - name: Test realtime control primitives
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package verified JUCE GUI for hardware FAT
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently verify release ZIP and embedded GUI/engine before upload
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-GUI10CH-P012-Verified-Hardware-FAT-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
