name: Windows Native VST3 Host
on:
  # Single canonical Windows release producer: main changes to shipped runtime,
  # native C++ or distribution scripts. Historical feature branch pushes are PRs.
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'integration/console-v6/**'
      # Native headers may live outside console-v6 (M3 readback/ABI).
      - 'integration/*.h'
      - 'integration/*.hpp'
      - 'integration/*.cpp'
      - 'integration/**/*.h'
      - 'integration/**/*.hpp'
      - 'integration/**/*.cpp'
      - 'src/**'
      - 'web/approved-native-bridge.js'
      - 'web/approved-native-contract.js'
      - 'tests/approved_native_m2_contract.test.cjs'
      - 'scripts/build_approved_native_gui.py'
      - 'tests/approved_native_gui_bundle_test.py'
      - 'engine/**'
      # Only the native WebView bridge can trigger Windows; pure GUI/CSS uses Chromium + Pages.
      - 'web/bridge.js'
      - 'web/monitor.js'
      - 'tests/*.cpp'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/collect_hardware_fat_windows.ps1'
      - 'scripts/console_v6_fat_gate.mjs'
      - 'scripts/verify_console_s0_native_fixture.mjs'
      - 'scripts/run_console_native_s0.mjs'
      - 'scripts/check_console_puzzle.mjs'
      - 'scripts/check_approved_native_gui_release.mjs'
      - 'scripts/check_pr278_console_authority.mjs'
      - 'scripts/m3e_fat_evidence_gate.mjs'
      - 'scripts/factoryfx_release_bundle.py'
      - 'config/factoryfx-approved-releases.json'
      - 'config/factoryfx-notices/**'
      - 'scripts/tests/test_factoryfx_release_bundle.py'
      - '.github/workflows/p1-windows.yml'
  # Direct native PR qualification; MSVC never waits on GUI or owner approval.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'CMakeLists.txt'
      - 'integration/console-v6/**'
      - 'integration/*.h'
      - 'integration/*.hpp'
      - 'integration/*.cpp'
      - 'integration/**/*.h'
      - 'integration/**/*.hpp'
      - 'integration/**/*.cpp'
      - 'src/**'
      - 'web/approved-native-bridge.js'
      - 'web/approved-native-contract.js'
      - 'tests/approved_native_m2_contract.test.cjs'
      - 'scripts/build_approved_native_gui.py'
      - 'tests/approved_native_gui_bundle_test.py'
      - 'engine/**'
      - 'web/bridge.js'
      - 'web/monitor.js'
      - 'tests/*.cpp'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/collect_hardware_fat_windows.ps1'
      - 'scripts/console_v6_fat_gate.mjs'
      - 'scripts/verify_console_s0_native_fixture.mjs'
      - 'scripts/run_console_native_s0.mjs'
      - 'scripts/check_console_puzzle.mjs'
      - 'scripts/check_approved_native_gui_release.mjs'
      - 'scripts/check_pr278_console_authority.mjs'
      - 'scripts/m3e_fat_evidence_gate.mjs'
      - 'scripts/factoryfx_release_bundle.py'
      - 'config/factoryfx-approved-releases.json'
      - 'config/factoryfx-notices/**'
      - 'scripts/tests/test_factoryfx_release_bundle.py'
      - '.github/workflows/p1-windows.yml'
      - 'tests/live_graph_contract_test.mjs'
      - 'tests/*native*contract*.mjs'
  workflow_dispatch:
    inputs:
      package_fat:
        description: "Package, verify and upload experimental Windows FAT ZIP"
        type: boolean
        required: false
        default: false

concurrency:
  group: windows-vst3-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  quick:
    name: Fast native contracts (no Windows / JUCE checkout)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catch broken native UI / CI contracts before a paid Windows runner
        run: |
          node scripts/check_console_puzzle.mjs
          node --check web/approved-native-bridge.js
          node --check web/approved-native-contract.js
          node --test tests/workstream_coordination_contract.test.mjs tests/ci_workflow_efficiency_test.mjs tests/approved_native_m2_contract.test.cjs tests/native_artifact_packaging_contract_test.mjs tests/live_graph_contract_test.mjs
          python -m unittest discover -s tests -p approved_native_gui_bundle_test.py -v
          python -m unittest discover -s scripts/tests -p test_factoryfx_release_bundle.py -v
  windows-build:
    name: Windows MSVC / realtime CTest
    needs: quick
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      # PR builds must package the exact branch HEAD, not GitHub's synthetic
      # pull/418/merge checkout. BUILD_PROVENANCE.json records this SHA and the
      # artifact verifier compares the embedded EXE, files and source tree.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA before native CTest / optional FAT ZIP
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:EXPECTED_SOURCE_SHA) {
            throw "FAT_SOURCE_HEAD_MISMATCH expected=$env:EXPECTED_SOURCE_SHA actual=$actual"
          }
          Write-Host "FAT_EXACT_PR_HEAD_CHECKOUT=$actual"
      - name: Cheap canonical Console v6 puzzle socket gate (no JUCE)
        run: node scripts/check_console_puzzle.mjs
      - name: Stop incomplete integrated product promotion before JUCE checkout
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/product-') }}
        run: node scripts/check_console_puzzle.mjs --release
      - name: Fast offline FactoryFX release and integrity contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_factoryfx_release_bundle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check approved Pages GUI provenance before costly JUCE checkout
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p approved_native_gui_bundle_test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout JUCE 8 pinned
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
      - name: Install WebView2 SDK for JUCE
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
      - name: Validate native UI JavaScript
        shell: pwsh
        run: |
          # Do not hide earlier Node failures with the exit code of the LAST
          # command. One Node invocation also avoids repeated startup costs.
          foreach ($file in @('web/bridge.js', 'web/plugin-ui.js', 'web/monitor.js', 'web/app.js', 'web/mixer-io.js', 'web/mixer-layout.js', 'web/approved-native-contract.js', 'web/approved-native-bridge.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $contracts = @(
            'tests/gui_workflow_contract_test.mjs'
            'tests/approved_native_m2_contract.test.cjs'
            'tests/native_ui_contract_test.mjs'
            'tests/native_preset_contract_test.mjs'
            'tests/fx_add_contract_test.mjs'
            'tests/fx_drag_reorder_contract_test.mjs'
            'tests/live_graph_contract_test.mjs'
            'tests/reconciled_gui_engine_contract_test.mjs'
            'tests/main_v08_native_integration_test.mjs'
            'tests/smart_audio_ard_contract_test.mjs'
            'tests/p0_diagnostic_contract_test.mjs'
            'tests/smart_audio_diagnostic_contract_test.mjs'
            'tests/independent_clock_adapter_contract_test.mjs'
            'tests/direct_restore_recovery_contract_test.mjs'
            'tests/native_artifact_packaging_contract_test.mjs'
            'tests/portable_workspace_contract_test.mjs'
            'tests/plugin_vault_contract_test.mjs'
            'tests/plugin_ui_contract_test.mjs'
            'tests/live_routing_ui_contract_test.mjs'
            'tests/mixer_io_operator_contract_test.mjs'
            'tests/mixer_shell_contract_test.mjs'
            'tests/studio_backup_contract_test.mjs'
          )
          node --test $contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows x64
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DJUCE_ROOT="${{ github.workspace }}/third_party/JUCE"
          -DBUILD_TESTING=ON
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/.deps"
      - name: Verify exact ONE approved /preview/ GUI CMake bundle
        run: node scripts/check_approved_native_gui_release.mjs --source-only --bundle build/approved_gui
      - name: Build executable and native RT tests
        run: cmake --build build --config Release --target ARMixConsole ARMixFactoryFxRegistryTests ARMixFxOrderTests ARMixFxStructuralHandoffTests ARMixMixerRoutingTests ARMixChannelRoutingContractTests ARMixChannelSendTests ARMixPreparedMixerBlockTests ARMixLiveRoutingEpochTests ARMixJucePortMaskTests ARMixNativeMixerSessionTests ARMixNativeDrySendTests ARMixLiveChannelFxTests ARMixDedicatedAuxBusTests ARMixTenChannelLiveControlTests ARMixWorkspaceTests ARMixVaultTests ARMixBackupTests ARMixOrbitPhaseTests ARMixOrbitControlTests ARMixOrbitMotionTests ARMixOrbitDistanceTests ARMixFxBypassEnvelopeTests ARMixDearVrPolarPolicyTests ARMixRTTests ARMixPresetTests ARMixShowSchemaTests ARMixShowStoreTests ARMixLiveShowCaptureTests ARMixNativeMasterLoudnessTests ARMixDiagnosticTests ARMixClockBridgeTests ARMixVirtualClockSoakTests ARMixCadenceTests ARMixCaptureBoundaryTests ARMixCrackleWindowTests ARMixHealthTests ARMixPolicyTests ARMixPeriodEvidenceTests ARMixLifecycleTests ARMixWasapiProbeTests ARMixDualJuceTests ARMixClockSizingTests ARMixIndependentFormatTests ARMixRecoveryTests ARMixStreamWatchdogTests ARMixBridgeContinuityTests ARMixEndpointPolicyTests ARMixEndpointGuardTests ARMixAsioPolicyTests ARMixAsioBackendTests ARMixAsioRegistryIdentityTests ARMixDirectFenceTests --parallel 2
      - name: Test realtime control primitives
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package verified JUCE GUI for hardware FAT
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.package_fat == true) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 418 && github.head_ref == 'integration/daw-direct-hardware-input-20261105' && github.event.pull_request.draft == false) }}
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage ONLY legally approved and host-qualified Factory VST3 bundles
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.package_fat == true) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 418 && github.head_ref == 'integration/daw-direct-hardware-input-20261105' && github.event.pull_request.draft == false) }}
        shell: pwsh
        run: |
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently verify release ZIP and embedded GUI/engine before upload
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.package_fat == true) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 418 && github.head_ref == 'integration/daw-direct-hardware-input-20261105' && github.event.pull_request.draft == false) }}
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Explicit one-time PR #418 review promotion is a user-authorized FAT ZIP opt-in.
      # No release publication; no package on ordinary PR synchronize or main push.
      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.package_fat == true) || (github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.event.pull_request.number == 418 && github.head_ref == 'integration/daw-direct-hardware-input-20261105' && github.event.pull_request.draft == false) }}
        with:
          name: ArSonMix-Windows-FAT-UNQUALIFIED-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
