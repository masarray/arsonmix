name: P1 Windows First Sound
on:
  push:
    branches: [ main, feature/p1-first-sound-windows ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Checkout JUCE 8 pinned
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
      - name: Configure Windows x64
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DJUCE_ROOT="${{ github.workspace }}/third_party/JUCE"
          -DBUILD_TESTING=ON
      - name: Build executable and native RT tests
        run: cmake --build build --config Release --target ARMixConsole ARMixRTTests --parallel 2
      - name: Test realtime control primitives
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package native executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = Get-ChildItem -Path build -Filter "*.exe" -Recurse |
            Where-Object { $_.Name -like "*AR*Mix*" -and $_.FullName -match 'Release' } |
            Select-Object -First 1
          if (-not $exe) { throw "ARMixConsole EXE not found" }
          Copy-Item $exe.FullName "dist/AR-MIX-Studio-P1.exe"
          Copy-Item README.md "dist/README.md"
          "P1 experimental: output muted until MONITOR ON; do not use during a public livestream without hardware tests." |
            Out-File -FilePath dist/FIRST_SOUND_README.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: AR-MIX-Studio-P1-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
