name: Windows Native VST3 Host
on:
  # Single canonical Windows release producer: main changes to shipped runtime,
  # native C++ or distribution scripts. Historical feature branch pushes are PRs.
  push:
    branches: [main]
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'engine/**'
      - 'web/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_ui_css.py'
      - 'tests/*.cpp'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/factoryfx_release_bundle.py'
      - 'config/factoryfx-approved-releases.json'
      - 'config/factoryfx-notices/**'
      - 'scripts/tests/test_factoryfx_release_bundle.py'
      - '.github/workflows/p1-windows.yml'
  # GUI-only PRs receive browser checks; they need not compile JUCE on every edit.
  # A merged GUI change is still packaged once on main, or manually for FAT.
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'engine/**'
      - 'tests/*.cpp'
      - 'tests/*native*contract*.mjs'
      - 'tests/live_graph_contract_test.mjs'
      - 'tests/ci_workflow_efficiency_test.mjs'
      - 'scripts/package_native_windows.ps1'
      - 'scripts/verify_native_windows_artifact.ps1'
      - 'scripts/factoryfx_release_bundle.py'
      - 'config/factoryfx-approved-releases.json'
      - 'config/factoryfx-notices/**'
      - 'scripts/tests/test_factoryfx_release_bundle.py'
      - '.github/workflows/p1-windows.yml'
  workflow_dispatch:

concurrency:
  group: windows-vst3-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Fast offline FactoryFX release and integrity contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/tests -p test_factoryfx_release_bundle.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Checkout JUCE 8 pinned
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
      - name: Install WebView2 SDK for JUCE
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
      - name: Validate native UI JavaScript
        shell: pwsh
        run: |
          # Do not hide earlier Node failures with the exit code of the LAST
          # command. One Node invocation also avoids repeated startup costs.
          foreach ($file in @('web/bridge.js', 'web/plugin-ui.js', 'web/monitor.js', 'web/app.js', 'web/mixer-io.js', 'web/mixer-layout.js')) {
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $contracts = @(
            'tests/gui_workflow_contract_test.mjs'
            'tests/native_ui_contract_test.mjs'
            'tests/native_preset_contract_test.mjs'
            'tests/fx_add_contract_test.mjs'
            'tests/fx_drag_reorder_contract_test.mjs'
            'tests/live_graph_contract_test.mjs'
            'tests/reconciled_gui_engine_contract_test.mjs'
            'tests/main_v08_native_integration_test.mjs'
            'tests/smart_audio_ard_contract_test.mjs'
            'tests/p0_diagnostic_contract_test.mjs'
            'tests/smart_audio_diagnostic_contract_test.mjs'
            'tests/independent_clock_adapter_contract_test.mjs'
            'tests/direct_restore_recovery_contract_test.mjs'
            'tests/native_artifact_packaging_contract_test.mjs'
            'tests/portable_workspace_contract_test.mjs'
            'tests/plugin_vault_contract_test.mjs'
            'tests/plugin_ui_contract_test.mjs'
            'tests/live_routing_ui_contract_test.mjs'
            'tests/mixer_io_operator_contract_test.mjs'
            'tests/mixer_shell_contract_test.mjs'
            'tests/studio_backup_contract_test.mjs'
          )
          node --test $contracts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure Windows x64
        shell: pwsh
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DJUCE_ROOT="${{ github.workspace }}/third_party/JUCE"
          -DBUILD_TESTING=ON
          -DJUCE_WEBVIEW2_PACKAGE_LOCATION="${{ github.workspace }}/.deps"
      - name: Build executable and native RT tests
        run: cmake --build build --config Release --target ARMixConsole ARMixFactoryFxRegistryTests ARMixFxOrderTests ARMixFxStructuralHandoffTests ARMixMixerRoutingTests ARMixChannelRoutingContractTests ARMixChannelSendTests ARMixPreparedMixerBlockTests ARMixLiveRoutingEpochTests ARMixJucePortMaskTests ARMixNativeMixerSessionTests ARMixNativeDrySendTests ARMixLiveChannelFxTests ARMixDedicatedAuxBusTests ARMixTenChannelLiveControlTests ARMixWorkspaceTests ARMixVaultTests ARMixBackupTests ARMixOrbitPhaseTests ARMixOrbitControlTests ARMixOrbitMotionTests ARMixOrbitDistanceTests ARMixFxBypassEnvelopeTests ARMixDearVrPolarPolicyTests ARMixRTTests ARMixPresetTests ARMixShowSchemaTests ARMixShowStoreTests ARMixLiveShowCaptureTests ARMixNativeMasterLoudnessTests ARMixDiagnosticTests ARMixClockBridgeTests ARMixVirtualClockSoakTests ARMixCadenceTests ARMixCrackleWindowTests ARMixHealthTests ARMixPolicyTests ARMixPeriodEvidenceTests ARMixLifecycleTests ARMixWasapiProbeTests ARMixDualJuceTests ARMixClockSizingTests ARMixIndependentFormatTests ARMixRecoveryTests ARMixStreamWatchdogTests ARMixBridgeContinuityTests ARMixEndpointPolicyTests ARMixEndpointGuardTests ARMixAsioPolicyTests ARMixAsioBackendTests ARMixAsioRegistryIdentityTests ARMixDirectFenceTests --parallel 2
      - name: Test realtime control primitives
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package verified JUCE GUI for hardware FAT
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Stage ONLY legally approved and host-qualified Factory VST3 bundles
        shell: pwsh
        run: |
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Independently verify release ZIP and embedded GUI/engine before upload
        shell: pwsh
        run: |
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Compile + CTest + distribution verification gate PRs; upload only
      # qualified main builds or an explicit branch FAT workflow_dispatch.
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' }}
        with:
          name: ArSonMix-GUI10CH-P012-Verified-Hardware-FAT-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 14
