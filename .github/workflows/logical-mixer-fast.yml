name: Logical Mixer (fast C++20)
on:
  push:
    branches:
      - feature/io-atomic-output-20261125
    paths:
      - 'engine/core/**'
      - 'tests/physical_external_output_pcm_test.cpp'
      - 'tests/dynamic_latency_compensation_test.cpp'
      - '.github/workflows/logical-mixer-fast.yml'
  pull_request:
    paths:
      - 'engine/core/DeviceIndependentMixerSession.h'
      - 'engine/core/DynamicChannelRoster.h'
      - 'engine/core/DynamicPreparedMixerBlock.h'
      - 'engine/core/StereoLatencyDelay.h'
      - 'engine/core/RealtimeSlew64.h'
      - 'engine/core/FxWorkloadEvidence.h'
      - 'engine/core/FxLifecyclePolicy.h'
      - 'engine/core/FxRackCatalogReplacement.h'
      - 'engine/core/MonitorTimingEdit.h'
      - 'engine/core/RenderPressureEvidence.h'
      - 'engine/core/CallbackCadenceEvidence.h'
      - 'tests/render_pressure_evidence_test.cpp'
      - 'engine/core/LiveChannelFxGraph.h'
      - 'tests/fx_global_workload_test.cpp'
      - 'engine/builtin_fx/GraphicEq31Core.h'
      - 'engine/builtin_fx/GraphicEq31Processor.h'
      - 'tests/geq_sparse_exact_test.cpp'
      - 'tests/fixtures/GraphicEq31Reference20261126.h'
      - 'engine/core/DynamicAcceptedSession.h'
      - 'engine/core/DynamicNativeSessionPublisher.h'
      - 'tests/dynamic_accepted_session_test.cpp'
      - 'tests/dmx_reverb_wet_return_test.cpp'
      - 'tests/dmx_output_sink_plan_test.cpp'
      - 'engine/core/DmxOutputSinkPlan.h'
      - 'third_party/arsonverb/include/arverb/Reverb.hpp'
      - 'third_party/arsonverb/src/Reverb.cpp'
      - 'tests/physical_external_output_pcm_test.cpp'
      - 'tests/dynamic_latency_compensation_test.cpp'
      - 'tests/device_independent_mixer_session_test.cpp'
      - '.github/workflows/logical-mixer-fast.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  logical-roster:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile deterministic native logical mixer (no hardware/JUCE)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tests/device_independent_mixer_session_test.cpp \
            -o /tmp/arsonmix-logical-test
          /tmp/arsonmix-logical-test
      - name: Compile and run native PCM gain, PRE/POST and SEND regressions (no JUCE)
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -I. \
            tests/dynamic_accepted_session_test.cpp \
            -o /tmp/arsonmix-dynamic-pcm-test
          /tmp/arsonmix-dynamic-pcm-test
      - name: Compile and run atomic external output publication (no JUCE)
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -I. \
            tests/physical_external_output_pcm_test.cpp \
            -o /tmp/arsonmix-external-pcm-test
          /tmp/arsonmix-external-pcm-test
      - name: Compile and run accepted PDC alignment and latency evidence (no JUCE)
        run: |
          c++ -std=c++20 -O1 -Wall -Wextra -Werror -I. \
            tests/dynamic_latency_compensation_test.cpp \
            -o /tmp/arsonmix-pdc-test
          /tmp/arsonmix-pdc-test
      - name: Compile global FX workload and latent dry-history regression (no JUCE)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tests/fx_global_workload_test.cpp -o /tmp/arsonmix-fx-global-test
          /tmp/arsonmix-fx-global-test

      - name: Compare sparse GEQ31 against exact previous core (no JUCE)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tests/geq_sparse_exact_test.cpp -o /tmp/arsonmix-geq-exact-test
          /tmp/arsonmix-geq-exact-test

      - name: Verify adjacent native render pressure correlation (no JUCE)
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -I. \
            tests/render_pressure_evidence_test.cpp -o /tmp/arsonmix-pressure-test
          /tmp/arsonmix-pressure-test
      - name: Real Reverb-Sis wet-only DSP and legacy insert compatibility
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Ithird_party/arsonverb/include \
            tests/dmx_reverb_wet_return_test.cpp third_party/arsonverb/src/Reverb.cpp \
            third_party/arsonverb/src/Presets.cpp -o /tmp/arsonmix-dmx-reverb
          /tmp/arsonmix-dmx-reverb
      - name: Exhaustive two-pin MAIN/MONITOR sink ownership
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror tests/dmx_output_sink_plan_test.cpp -o /tmp/arsonmix-dmx-sinks
          /tmp/arsonmix-dmx-sinks
