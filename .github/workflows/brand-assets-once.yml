name: Materialize selected ArSonMix brand binaries (one-time)
on:
  push:
    branches: [fix/arsonmix-brand-package-assets-20261107]
    paths:
      - '.github/workflows/brand-assets-once.yml'
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify real favicon and ICO assets
        run: |
          python scripts/sync_brand_assets.py
          python scripts/sync_brand_assets.py --check
          python -m unittest discover -s tests -p brand_icon_contract_test.py -v
      - name: Commit generated binary resources to the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/icon/ site/favicon.ico site/favicon-16x16.png site/favicon-32x32.png site/apple-touch-icon.png site/android-chrome-192x192.png site/android-chrome-512x512.png site/site.webmanifest
          if ! git diff --cached --quiet; then
            git commit -m "assets: materialize approved ArSonMix web and Windows icon binaries"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
