name: P0 production Main.cpp MSVC compile preflight
on:
  push:
    branches:
      - staging/p0-arsonmix-reliability-20261124
      - feature/io-studio-workflow-20261125
      - feature/io-atomic-output-20261125
      - feat/reverb-sis-signature-20261125
      - staging/io-reverb-integrated-20261125
    # These are explicit qualification branches, not general development.
    # Every new HEAD needs its own evidence, even a UI/workflow-only commit.
permissions:
  contents: read
concurrency:
  group: p0-console-compile-preflight-${{ github.ref }}
  cancel-in-progress: true
jobs:
  actual-console-translation-unit:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile actual production Main.cpp and SDK adapter with branded FAT flags
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (!$vs) { throw 'MSVC_NOT_FOUND' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $actual = (& git rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw 'P0_PREFLIGHT_SOURCE_MISMATCH' }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DJUCE_ROOT=$env:GITHUB_WORKSPACE/third_party/JUCE" "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=$env:GITHUB_WORKSPACE/.deps" -DBUILD_TESTING=ON -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON -DARMIX_SONKU_APPROVED_P99_MAIN=ON
          if ($LASTEXITCODE -ne 0) { throw 'P0_PREFLIGHT_CONFIGURE_FAILED' }
          $targets = (& ninja -C build -t targets all)
          if ($LASTEXITCODE -ne 0) { throw 'P0_PREFLIGHT_TARGETS_FAILED' }
          $objects = @('CMakeFiles/ARMixConsole.dir/src/Main.cpp.obj','CMakeFiles/ARMixConsole.dir/src/NativeFxWin32Owner.cpp.obj')
          foreach ($object in $objects) {
            if (!($targets | Where-Object { $_.StartsWith("${object}:") })) { throw "P0_PREFLIGHT_MISSING_OBJECT: $object" }
          }
          # The stacked Audio I/O PR cannot use the main-only FAT dispatcher.
          # Test the actual JUCE disk store with assertions enabled before
          # compiling the production translation unit. This is not FAT or a
          # protected nativeFull gate and does not publish an executable.
          if ($env:GITHUB_REF_NAME -in @('feature/io-studio-workflow-20261125','feature/io-atomic-output-20261125','staging/io-reverb-integrated-20261125')) {
            cmake --build build --parallel 2 --target ARMixChannelAppearanceTests
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_NATIVE_STORE_COMPILE_FAILED' }
            $catalog = (& ctest --test-dir build --show-only=json-v1 | Out-String | ConvertFrom-Json)
            if ($LASTEXITCODE -ne 0 -or !($catalog.tests | Where-Object { $_.name -eq 'NativeChannelIdentityDiskAckAndExactId' })) {
              throw 'AUDIO_IO_NATIVE_STORE_CTEST_MISSING'
            }
            ctest --test-dir build --output-on-failure -R '^NativeChannelIdentityDiskAckAndExactId$'
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_NATIVE_STORE_CTEST_FAILED' }
            Write-Host "AUDIO_IO_NATIVE_STORE_CTEST_PASS exact=$actual"
            cmake --build build --parallel 2 --target ARMixDurableMixerSessionTests
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_SESSION_COMPILE_FAILED' }
            if (!($catalog.tests | Where-Object { $_.name -eq 'P0DynamicMixerSessionDocumentAndCrashSafeRecovery' })) {
              throw 'AUDIO_IO_SESSION_CTEST_MISSING'
            }
            ctest --test-dir build --output-on-failure -R '^P0DynamicMixerSessionDocumentAndCrashSafeRecovery$'
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_SESSION_CTEST_FAILED' }
            Write-Host "AUDIO_IO_SESSION_CTEST_PASS exact=$actual"
            cmake --build build --parallel 2 --target ARMixPhysicalExternalOutputTests
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_EXTERNAL_PCM_COMPILE_FAILED' }
            if (!($catalog.tests | Where-Object { $_.name -eq 'O1PhysicalExternalOutputNativePcmAndFailClosedRouting' })) {
              throw 'AUDIO_IO_EXTERNAL_PCM_CTEST_MISSING'
            }
            ctest --test-dir build --output-on-failure -R '^O1PhysicalExternalOutputNativePcmAndFailClosedRouting$'
            if ($LASTEXITCODE -ne 0) { throw 'AUDIO_IO_EXTERNAL_PCM_CTEST_FAILED' }
            Write-Host "AUDIO_IO_EXTERNAL_PCM_CTEST_PASS exact=$actual"
          }
          # Fast object gate remains common to all qualification branches.
          # Only the integrated candidate proceeds to full product build below.
          cmake --build build --parallel 2 --target $objects
          if ($LASTEXITCODE -ne 0) { throw 'P0_PRODUCTION_TRANSLATION_UNIT_FAILED' }
          Write-Host "P0_PRODUCTION_MAIN_COMPILE_PASS exact=$actual (object only, NOT full FAT)"
      - name: Integrated product link and full native CTest (no packaging)
        if: github.ref_name == 'staging/io-reverb-integrated-20261125'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if (!$vs) { throw 'MSVC_NOT_FOUND' }
          Import-Module (Join-Path $vs 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'INTEGRATED_SOURCE_MISMATCH' }
          cmake --build build --parallel 2 --target ARMixConsole
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED_CONSOLE_LINK_FAILED' }
          Write-Host "INTEGRATED_CONSOLE_LINK_PASS exact=$actual"
          cmake --build build --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED_FULL_BUILD_FAILED' }
          ctest --test-dir build --output-on-failure --no-tests=error --output-junit integrated-ctest.xml
          if ($LASTEXITCODE -ne 0) { throw 'INTEGRATED_FULL_CTEST_FAILED' }
          Write-Host "INTEGRATED_FULL_CTEST_PASS exact=$actual (no hardware or installer FAT)"
      - uses: actions/upload-artifact@v4
        if: always() && github.ref_name == 'staging/io-reverb-integrated-20261125'
        with:
          name: integrated-native-ctest-${{ github.sha }}
          path: build/integrated-ctest.xml
          if-no-files-found: ignore
          retention-days: 7
