name: ImerSip P8.2 phase + bass fast native
on:
  pull_request:
    paths:
      - 'engine/builtin_fx/ImerSip*.h'
      - 'tests/imersip_music_phase_guard_test.cpp'
      - 'tests/imersip_fx_picker_contract_test.py'
      - 'tests/imersip_native_picker_chromium_smoke.py'
      - 'src/NativeBuiltInFx.h'
      - 'scripts/compose_native_peq.py'
      - 'scripts/build_approved_native_gui.py'
      - 'web/approved-native-bridge.js'
      - 'CMakeLists.txt'
      - '.github/workflows/imersip-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-pcm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile real SonKu P8.2 plus ImerSip phase-safe enhancer
        shell: bash
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Werror \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            tests/imersip_music_phase_guard_test.cpp -o imersip_music_test
      - name: PCM original P8.2 parity, mono-fold, bass, anti-phase, chunk checks
        run: ./imersip_music_test
      - name: Build-to-FX-Picker registration and JUCE host contract
        run: python -m unittest discover -s tests -p imersip_fx_picker_contract_test.py -v

  picker-visual:
    name: ImerSip in actual compiled native FX Picker (Chromium)
    needs: source-pcm
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated browser driver
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visual native GUI catalog, search, JUCE intent and no fake PCM
        run: python tests/imersip_native_picker_chromium_smoke.py
      - name: Upload actual ImerSip picker screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ImerSip-Native-FX-Picker-Evidence-${{ github.run_id }}
          path: imersip-visible-native-picker.png
          if-no-files-found: ignore
          retention-days: 14
