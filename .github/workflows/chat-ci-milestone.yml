name: ChatGPT CI Milestone Dispatcher
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: write
concurrency:
  group: chat-ci-pr-\${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  dispatch:
    name: Owner-authorized exact-SHA CI request
    if: >-
      \\${{
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/arsonmix-ci ') &&
        github.event.comment.author_association == 'OWNER' &&
        github.event.comment.user.login == github.repository_owner
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: \${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Authorize exact SHA and dispatch one CI lane
        env:
          GH_TOKEN: \${{ github.token }}
          GITHUB_REPOSITORY: \${{ github.repository }}
          GITHUB_EVENT_PATH: \${{ github.event_path }}
        run: node scripts/chat_ci_dispatch.mjs
