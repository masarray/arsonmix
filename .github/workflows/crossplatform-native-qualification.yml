name: ArSonMix Native Cross-Platform Qualification (opt-in only)
on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options: [linux, macos]
      source_branch:
        required: true
        type: string
      expected_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: port-${{ inputs.platform }}-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Cheap portability preflight - no macOS / compiler allocation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Lease exact owner-approved branch SHA and test known portability blockers
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          TARGET_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$EXPECTED_SHA"
          python scripts/check_platform_portability.py --platform "$TARGET_PLATFORM"

  native:
    name: Actual platform JUCE compile and core CTest
    needs: preflight
    runs-on: ${{ inputs.platform == 'macos' && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Linux host prerequisites
        if: ${{ inputs.platform == 'linux' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libfreetype-dev libwebkit2gtk-4.1-dev libgtk-3-dev libgl1-mesa-dev libx11-dev libxinerama-dev libxrandr-dev libxcursor-dev libcurl4-openssl-dev
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
      - name: Configure native app against JUCE 8
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJUCE_ROOT="$GITHUB_WORKSPACE/third_party/JUCE" -DBUILD_TESTING=ON
      - name: Compile actual host executable and registered unit tests
        run: cmake --build build --config Release --parallel 2
      - name: Check native routing, FX, Show and device regressions
        run: ctest --test-dir build -C Release --output-on-failure
