name: Guitar FX assets — fast, path-scoped
# No Chromium, MSVC, audio device, installer, npm packages or external downloads.
# Only this feature's own asset and UX-study paths trigger the contract.
on:
  pull_request:
    paths:
      - 'design-references/guitar-fx/**'
      - 'docs/guitar-fx/**'
      - 'scripts/build_guitar_fx_assets.mjs'
      - 'scripts/build_guitar_fx_layered_assets.mjs'
      - 'engine/builtin_fx/GuitarRigEditor.h'
      - 'CMakeLists.txt'
      - 'engine/builtin_fx/guitar/**'
      - 'tests/guitar_fx_program_model_test.cpp'
      - 'tests/guitar_fx_hardware_geometry_test.cpp'
      - 'tests/guitar_fx_core_pcm_test.cpp'
      - 'tests/guitar_fx_assets_contract.test.mjs'
      - '.github/workflows/guitar-fx-assets.yml'
  push:
    branches: [main]
    paths:
      - 'design-references/guitar-fx/**'
      - 'docs/guitar-fx/**'
      - 'scripts/build_guitar_fx_assets.mjs'
      - 'scripts/build_guitar_fx_layered_assets.mjs'
      - 'engine/builtin_fx/GuitarRigEditor.h'
      - 'CMakeLists.txt'
      - 'engine/builtin_fx/guitar/**'
      - 'tests/guitar_fx_program_model_test.cpp'
      - 'tests/guitar_fx_hardware_geometry_test.cpp'
      - 'tests/guitar_fx_core_pcm_test.cpp'
      - 'tests/guitar_fx_assets_contract.test.mjs'
      - '.github/workflows/guitar-fx-assets.yml'
permissions:
  contents: read
concurrency:
  group: guitar-fx-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  original-hardware-assets:
    name: Validate reproducible PNGs and truthful editor study
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify original PNG structure, bounds and deterministic output
        run: node --test tests/guitar_fx_assets_contract.test.mjs
      - name: Verify bounded C++ program model without JUCE or Windows
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/guitar_fx_program_model_test.cpp -o /tmp/guitar-fx-program-model-test
          /tmp/guitar-fx-program-model-test
      - name: Verify physical anchor geometry, no control overlap and HiDPI transforms
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/guitar_fx_hardware_geometry_test.cpp -o /tmp/guitar-fx-hardware-geometry-test
          /tmp/guitar-fx-hardware-geometry-test
      - name: Verify wet PCM, 2x antialias and fixed 48-sample PDC without JUCE
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic tests/guitar_fx_core_pcm_test.cpp -o /tmp/guitar-fx-core-pcm-test
          /tmp/guitar-fx-core-pcm-test
