name: UI smoke (Chromium)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Standalone UI and geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JavaScript syntax
        run: node --check web/app.js
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify original metallic asset and standalone synchronization
        run: python tests/fader_asset_test.py
      - name: Check switch PNG assets and offline HTML sync
        run: python tests/button_asset_test.py
      - name: Check PAN and button PNG assets
        run: python tests/pan_button_asset_test.py
      - name: Run mixer UI smoke tests
        run: python tests/ui_smoke.py
      - name: Attach visual regression screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ar-mix-fader-smoke
          path: |
            fader-ui-smoke.png
            mixer-design-review.png
            mixer-design-review-1440.png
            mixer-master-clip-review.png
          if-no-files-found: ignore
