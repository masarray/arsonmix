name: UI smoke (Chromium)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'integration/console-v6/**'
      - 'site/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      - 'tests/**'
      - 'scripts/build_ui_css.py'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages-publish.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'integration/console-v6/**'
      - 'site/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      - 'scripts/build_ui_css.py'
      - 'tests/*.py'
      - 'tests/gui_workflow_contract_test.mjs'
      - 'tests/*gui*contract*.mjs'
      - 'tests/native_ui_contract_test.mjs'
      - 'tests/native_orbit_ui_smoke.py'
      - 'tests/ci_workflow_efficiency_test.mjs'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages-publish.yml'
  workflow_dispatch:

# New PR commits supersede old UI checks. The production Pages dispatcher
# only reacts to a completed successful main push, never cancelled checks.
concurrency:
  group: ui-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Standalone UI and geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cheap canonical Console v6 puzzle socket gate
        run: node scripts/check_console_puzzle.mjs
      - name: Stop incomplete integrated product promotion before browser setup
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/product-') }}
        run: node scripts/check_console_puzzle.mjs --release
      - name: Verify CSS ownership build and offline/WebView2 parity
        run: python scripts/build_ui_css.py --check
      - name: Verify immutable approved Brushed Metal CSS and non-destructive preview
        run: python tests/theme_reference_fixture_test.py
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/plugin-ui.js
          node --check web/mixer-io.js
          node --check web/mixer-layout.js
          node --test tests/gui_workflow_contract_test.mjs tests/plugin_ui_contract_test.mjs tests/ci_workflow_efficiency_test.mjs tests/fx_drag_reorder_contract_test.mjs tests/mixer_io_operator_contract_test.mjs tests/mixer_shell_contract_test.mjs
      - name: Validate approved GUI checkpoint and single publisher
        run: python tests/gui_baseline_lock_test.py
      - name: Validate smart audio architecture handoff contract
        run: node --test tests/smart_audio_ard_contract_test.mjs
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify original metallic asset and standalone synchronization
        run: python tests/fader_asset_test.py
      - name: Validate recessed Button 180 + embedded Inter font contract
        run: python tests/button_asset_test.py
      - name: Verify SVG WIRE knob mask available on all preview routes
        run: python tests/wire_knob_asset_contract_test.py
      - name: Verify original PAN slider and CSS buttons
        run: python tests/pan_button_asset_test.py
      - name: Validate linked 11-strip geometry and LV1-style rail workspace
        run: python tests/mixer_shell_geometry_smoke.py
      - name: Verify V8 FX rack and Plugin Manager CSS ownership
        run: python tests/pages_css_ownership_v8_smoke.py
      - name: Verify V9 PAN/fader/meter CSS ownership and geometry
        run: python tests/pages_css_ownership_v9_smoke.py
      - name: Verify V10 cascade ownership and rendered console geometry
        run: python tests/pages_css_architecture_v10_smoke.py
      - name: Validate V11 section ownership, cascade and computed visual styles
        run: python tests/pages_css_architecture_v11_smoke.py
      - name: Verify V12 removed shadow declarations and old/new visual + control parity
        run: python tests/pages_css_architecture_v12_smoke.py
      - name: Verify V13 owned CSS conflicts and physical control visual parity
        run: python tests/pages_css_architecture_v13_smoke.py
      - name: Verify V14 canonical 45 material tokens and V13 browser parity
        run: python tests/pages_css_architecture_v14_smoke.py
      - name: Verify V15 clean cross-owner CSS and actual interactive visual parity
        run: python tests/pages_css_architecture_v15_smoke.py
      - name: Verify embedded Inter font and contextual V7 micro-controls
        run: python tests/pages_inter_utility_v7_smoke.py
      - name: Verify owned V6 mixer hardware keys and WIRE regression
        run: python tests/pages_controls_v6_smoke.py
      - name: Verify CSS-built MUTE reference face and active/inactive interaction
        run: python tests/pages_mute_css_reference_smoke.py
      - name: Reconcile PNG button preview with exact latest WIRE source and geometry
        run: python tests/pages_png_buttons_wire_reconciliation_smoke.py
      - name: Verify V6 contextual buttons, momentary press and zero pointer scroll
        run: python tests/pages_contextual_buttons_smoke.py
      - name: Run mixer UI smoke tests
        run: python tests/ui_smoke.py
      - name: Verify Preview V2 V7 physical visual geometry and modeless mixer workflow
        run: python tests/preview_v2_v7_visual_smoke.py
      - name: Verify V15 real pointer OUT-to-IN wire and exclusive Bus routing
        run: python tests/preview_v15_drag_wire_smoke.py
      - name: Verify V40 WIRE proximity, focus release and full-tray channel selection
        run: python tests/pages_wire_focus_v40_smoke.py
      - name: Verify V42 original OUT fill and magnetic dot-follow drag
        run: python tests/pages_wire_dot_v42_smoke.py
      - name: Verify V43 public Pages WIRE CSS, incoming cables and propagating socket impact
        run: python tests/pages_wire_incoming_v43_smoke.py
      - name: Verify V44 dock, cable-matched dots, right labels, folded row and broader impact
        run: python tests/pages_wire_v44_finish_smoke.py
      - name: Verify V45 destination channel-color socket and collision-free responsive captions
        run: python tests/pages_wire_v45_socket_layout_smoke.py
      - name: Verify V46 exact dot endpoint anchors, LVL geometry and socket inner color
        run: python tests/pages_wire_v46_precision_smoke.py
      - name: Verify G1/G2 LIVE mixer bank and native I/O transaction
        run: python tests/mixer_io_smoke.py
      - name: Verify MIX and FX RACK Auto Orbit workflow
        run: python tests/native_orbit_ui_smoke.py
      # Firefox perf is deliberate: main release verification or manual opt-in.
      # Do not download/run a second browser for every iterative GUI PR.
      - name: Install Firefox for compositor functional regression
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m playwright install firefox
      - name: Run Firefox opt-in performance diagnostics smoke
        if: ${{ github.event_name != 'pull_request' }}
        run: python tests/ui_firefox_perf_smoke.py
      - name: Attach visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsonmix-gui-baseline-smoke
          path: |
            native-orbit-ui-review.png
            mixer-g1-g2-1366.png
            mixer-g1-g2-1440.png
            mixer-g1-g2-1680.png
            mixer-g1-bank-fx-1680.png
            mixer-g1-bank-route-1680.png
            mixer-g1-bank-sends-1680.png
            mixer-shell-fx-1680.png
            mixer-shell-route-1680.png
            mixer-shell-sends-1680.png
            mixer-shell-compact-1366.png
            fader-ui-smoke.png
            toolbar-global-btn180-pad.png
            device-green-on-palette-review.png
            pages-v8-fx-rack-expanded-1680.png
            pages-v8-fx-browser-closed-1680.png
            pages-v9-pan-fader-meter-1366.png
            pages-v9-pan-fader-meter-1680.png
            pages-v10-shell-1366.png
            pages-v10-shell-1680.png
            pages-v11-collapse-1366.png
            pages-v11-console-1680.png
            pages-v12-console-1680.png
            pages-v13-owner-console-1680.png
            pages-v14-tokens-console-1680.png
            pages-v15-clean-cascade-1680.png
            pages-v7-embedded-inter-utility-1680.png
            pages-mixer-v6-OFF-1680.png
            pages-mixer-v6-ON-1680.png
            mixer-design-review.png
            preview-v2-v7-1366.png
            preview-v2-v7-1666.png
            preview-v2-v7-1920.png
            preview-operator-1366.png
            preview-operator-1666.png
            preview-operator-1920.png
            preview-operator-1711.png
            preview-v13-all-expanded-1711.png
            preview-v14-all-folded-1711.png
            preview-v16-reordered-1711.png
            preview-v2-v7-1711.png
            preview-v15-wire-left-1680.png
            preview-v15-wire-bus-only-1680.png
            preview-p0-fx-expanded-1366.png
            site/preview-v2/index.html
            site/preview-v2/assets/
            mixer-design-review-1440.png
            native-input-patch-review-1680.png
            native-input-patch-review-1440.png
            mixer-master-clip-review.png
            mixer-pro-view-review.png
            mixer-master-dual-metric-left-rail.png
            mixer-crystal-candy-review.png
            mixer-crystal-depth-glow-review.png
            mixer-inter-recessed-toggle-review.png
            mixer-left-rail-unified-button180-pan-131512.png
          if-no-files-found: ignore
          retention-days: 3
