name: UI smoke (Chromium)
# FAST default: current critical paths only. Full historical suite only on manual dispatch
# or release integration PR. Pages publisher waits for successful quick main push.

on:
  # IMPORTANT: CI/dispatcher-only commits are checked in PR by the fast UI
  # contract lane. They MUST NOT trigger a main full Chromium run: a successful
  # fast-only workflow_run would falsely qualify Pages without a visual test.
  # Actual preview/web/UI-test source still triggers the full Chromium gate.
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'integration/console-v6/**'
      - 'site/preview-v2/**'
      - 'site/preview-buttons/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      # GUI-only changes: do not start Chromium for native C++ or PCM tests.
      - 'tests/*.py'
      # Packaging/port release tests do not change Chromium GUI behaviour.
      - '!tests/test_platform_portability.py'
      - '!tests/test_release_catalog.py'
      - '!tests/test_release_setup_zip.py'
      - 'tests/gui_workflow_contract_test.mjs'
      - 'tests/*gui*contract*.mjs'
      - 'tests/native_ui_contract_test.mjs'
      - 'tests/wire_graph_canonical_model.test.cjs'
      - 'tests/wire_main_native_handoff_contract.test.cjs'
      - 'tests/approved_native_m2_contract.test.cjs'
      - 'scripts/build_ui_css.py'
  # Only user-facing GUI/bridge files are relevant. No PR metadata API gate.
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
    paths:
      - 'web/**'
      - 'integration/console-v6/**'
      - 'site/preview-v2/**'
      - 'site/preview-buttons/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      - 'tests/*.py'
      # Packaging/port release tests do not change Chromium GUI behaviour.
      - '!tests/test_platform_portability.py'
      - '!tests/test_release_catalog.py'
      - '!tests/test_release_setup_zip.py'
      - 'tests/gui_workflow_contract_test.mjs'
      - 'tests/*gui*contract*.mjs'
      - 'tests/native_ui_contract_test.mjs'
      - 'tests/wire_graph_canonical_model.test.cjs'
      - 'tests/wire_main_native_handoff_contract.test.cjs'
      - 'tests/ci_workflow_efficiency_test.mjs'
      - 'tests/approved_native_m2_contract.test.cjs'
      - 'scripts/build_ui_css.py'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages-publish.yml'
      - 'scripts/chat_ci_dispatch.mjs'
      - 'tests/chat_ci_dispatch_contract.test.mjs'
      - '.github/workflows/chat-ci-milestone.yml'
  # Exact-SHA product qualification covers the CURRENT shipped console.
  # Immutable historical migrations are an independent maintenance opt-in.
  workflow_dispatch:
    inputs:
      historical_css:
        description: "Also run archived V8-V27 migration fixtures (CSS maintenance only)"
        type: boolean
        required: false
        default: false
      expected_sha:
        description: "Immutable source SHA for ChatGPT milestone"
        type: string
        required: false
        default: ""

# New PR commits supersede old UI checks. The production Pages dispatcher
# only reacts to a completed successful main push, never cancelled checks.
concurrency:
  # An explicit manual visual qualification is never canceled by new commits.
  group: ui-smoke-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read
  pull-requests: read

jobs:

  quick:
    name: Fast UI contracts (every relevant PR commit)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: V60 fast no-browser fader and WIRE motion contract
        run: python tests/pages_v60_fader_wire_tactile_smoke.py --source
      - name: Verify approved /preview/ and native bridge syntax without browser
        run: |
          node scripts/check_console_puzzle.mjs
          node --check web/app.js
          node --check web/approved-native-bridge.js
          node --check web/approved-native-contract.js
          node --check site/preview-v2/assets/gui-perf-probe.js
          node --check site/preview-v2/assets/mixer-native-peq.js
          node --check site/preview-v2/assets/mixer-native-compressor.js
          node --check site/preview-v2/assets/mixer-native-harmony.js
          python tests/native_harmony_assembly_test.py
          node --check site/preview-v2/assets/mixer-native-vocal-throw.js
          node --check site/preview-v2/assets/mixer-native-sonku.js
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tests/sonku_spatial_core_test.cpp -o /tmp/armix-sonku-core-smoke
          /tmp/armix-sonku-core-smoke
          python tests/native_peq_assembly_test.py
          python tests/native_v60_fader_assembly_contract.py
          python tests/approved_operator_ux_smoke.py
          python scripts/build_ui_css.py --check
          # Fast source-only CSS owner gate: catch stacking before expensive Chromium.
          python scripts/check_preview_css_ownership.py
          python -m unittest discover -s tests -p approved_preview_css_owner_nonregression_test.py -v
          python tests/gui_baseline_lock_test.py
          python tests/brand_icon_contract_test.py
          python tests/brand_package_files_test.py
          python tests/css_v28_restore.py
      - name: Check native UI contracts, workflow policy, and WIRE without Chromium
        run: |
          node --test tests/floating_window_workspace_contract.test.mjs
          node --test tests/rc_operator_workflow_contract.test.mjs
          node --test tests/workstream_coordination_contract.test.mjs tests/chat_ci_dispatch_contract.test.mjs tests/gui_workflow_contract_test.mjs tests/plugin_ui_contract_test.mjs tests/ci_workflow_efficiency_test.mjs tests/fx_drag_reorder_contract_test.mjs tests/mixer_io_operator_contract_test.mjs tests/mixer_shell_contract_test.mjs tests/approved_native_m2_contract.test.cjs
          node tests/wire_graph_canonical_model.test.cjs
          node tests/wire_main_native_handoff_contract.test.cjs
      - name: Verify single published /preview/ source offline
        run: |
          python scripts/build_pages.py --out dist-pages --sha "${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha || github.sha }}" --branch main
          python tests/single_preview_publication_contract_test.py dist-pages
      - name: Block incomplete product release only when preparing product review
        if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft && startsWith(github.head_ref, 'integration/product-') }}
        run: node scripts/check_console_puzzle.mjs --release
  floating-window-preview:
    name: Modeless floating cards actual Chromium interactions (2 viewports)
    needs: quick
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'fix/floating-window-ux-unification-20261111' || github.head_ref == 'fix/rc-ux-audio-first-run-20261112' || startsWith(github.head_ref, 'fix/gui-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install one scoped Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Drag Routes, Matrix, Wire Setup and FX; verify close geometry
        run: python tests/approved_floating_window_chromium_smoke.py
      - name: V60 physical fader detent and full-length WIRE actual Chromium QA
        if: ${{ startsWith(github.head_ref, 'fix/gui-fader-unity-wire-') }}
        run: python tests/pages_v60_fader_wire_tactile_smoke.py
      - name: Assemble exact-source official Pages preview for touch Chromium test
        if: ${{ startsWith(github.head_ref, 'fix/gui-') }}
        run: python scripts/build_pages.py --out dist-pages --sha "${{ github.event.pull_request.head.sha }}" --branch main
      - name: Verify touch toolbar More keeps Add Audio available at 360/390/430px
        if: ${{ startsWith(github.head_ref, 'fix/gui-') }}
        run: python tests/approved_preview_mobile_navigation_smoke.py
      - name: Check Vocal Delay editor, picker and plugin native UI at two viewport widths
        if: ${{ github.head_ref == 'fix/rc-ux-audio-first-run-20261112' }}
        run: python tests/approved_native_vocal_throw_smoke.py
      # RC branch only: run the current downstream GUI/WIRE/FX regressions
      # before any manual full-browser milestone to avoid repeatedly paying
      # for the entire 60+ step visual qualification on stale UI fixtures.
      # This is additive: the full manual gate remains mandatory before merge.
      - name: RC downstream current-preview visual and interaction preflight
        if: ${{ github.head_ref == 'fix/rc-ux-audio-first-run-20261112' }}
        run: |
          python tests/preview_v2_v7_visual_smoke.py
          python tests/pages_wire_focus_v40_smoke.py
          python tests/pages_wire_dot_v42_smoke.py
          python tests/pages_wire_v44_finish_smoke.py
          python tests/pages_wire_v45_socket_layout_smoke.py
          python tests/pages_wire_v46_precision_smoke.py
          python tests/mixer_io_smoke.py
          python tests/native_orbit_ui_smoke.py
      - name: Keep compact desktop and narrow viewport evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-Floating-UX-${{ github.run_id }}
          path: |
            arsonmix-floating-ux-*.png
            arsonmix-v60-*.png
          if-no-files-found: ignore
          retention-days: 7

  sonku-preview:
    name: 8D-SonKu native insert/editor Chromium FAT (desktop and narrow)
    needs: quick
    # Both 8D-SonKu and SOF native-owner PRs share ONE actual Chromium runner.
    # Preserve fast-only checks for unrelated GUI and engine branches.
    if: ${{ (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feat/8d-sonku-') || (startsWith(github.head_ref, 'feat/sonku-') && !startsWith(github.head_ref, 'feat/sonku-music-integrity-')) || startsWith(github.head_ref, 'test/sof-native-') || startsWith(github.head_ref, 'integration/sof-sonku-main-') || startsWith(github.head_ref, 'fix/native-wire-inspector-') || (startsWith(github.head_ref, 'integration/sonku-m4-wire-') || startsWith(github.head_ref, 'integration/sonku-m4-guitar-picker-') || startsWith(github.head_ref, 'fix/sonku-')))) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/8d-sonku-') && inputs.expected_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scoped Chromium only
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Actual native picker insert, ACK/readback, editor open, UI controls
        run: python tests/approved_native_sonku_smoke.py
      # Same Chromium installation and same native-only GUI assembler.
      # Fast scoped SOF qualification runs on the existing SonKu integration
      # job (zero additional browser runners and zero Windows recompiles).
      - name: Native SOF PRE/POST, SEND ON, EdgeId gain and ACK/readback Chromium
        # GUI-only depth work must not recompile unrelated native/audio FAT.
        if: ${{ !startsWith(github.head_ref, 'feat/sonku-depth-') }}
        run: python tests/approved_native_sof_chromium_smoke.py
      - name: Native WIRE Inspector rejected gain and exact EdgeId ACK rollback (real Chromium)
        # GUI-only depth work must not recompile unrelated native/audio FAT.
        if: ${{ !startsWith(github.head_ref, 'feat/sonku-depth-') }}
        run: python tests/approved_native_wire_gain_smoke.py
      - name: Integrated V65 WIRE motion, SOF and actual native WIRE regression
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/sof-sonku-main-') }}
        run: |
          python tests/pages_v60_fader_wire_tactile_smoke.py
          python tests/approved_native_wire_gain_smoke.py
          python tests/sof_contextual_console_smoke.py
      - name: Render original 8D-SonKu headphone candidate through exact native HRTF
        # GUI-only depth work must not recompile unrelated native/audio FAT.
        if: ${{ !startsWith(github.head_ref, 'feat/sonku-depth-') }}
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tools/sonku_offline_listening.cpp -o /tmp/sonku-listening
          /tmp/sonku-listening sonku-listening
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tests/sonku_early_reflections_test.cpp -o /tmp/sonku-room-test
          /tmp/sonku-room-test
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tests/sonku_musical_reverb_test.cpp -o /tmp/sonku-fdn-test
          /tmp/sonku-fdn-test
      - name: SonKu same-runner realtime CPU comparison (informational, not a release pass)
        # GUI-only depth work must not recompile unrelated native/audio FAT.
        if: ${{ !startsWith(github.head_ref, 'feat/sonku-depth-') }}
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tools/sonku_rt_benchmark.cpp -o /tmp/sonku-rt-bench
          /tmp/sonku-rt-bench
          python tests/sonku_offline_demo_contract.py sonku-listening
      - name: Publish 8D-SonKu reproducible listening WAVs and blind answer key
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-SonKu-Headphone-Audio-${{ github.run_id }}
          path: sonku-listening/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep verified 8D-SonKu editor screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-SonKu-Editor-${{ github.run_id }}
          path: arsonmix-sonku-editor-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep native SOF accepted-state desktop and narrow screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-SOF-PCM-Bridge-${{ github.run_id }}
          path: |
            arsonmix-native-sof-*.png
            arsonmix-v60-*.png
            native-wire-gain-*.png
          if-no-files-found: ignore
          retention-days: 7

  sonku-music-integrity-audio:
    name: SonKu music integrity native WAV/CPU (no Chromium, no Windows packaging)
    needs: quick
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/sonku-music-integrity-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      # Public alpha.23 is immutable baseline; fetch ONLY SonKu engine
      # headers for matched native C++ reference rendering (no JUCE/SDK).
      - name: Checkout immutable public alpha.23 SonKu baseline headers
        uses: actions/checkout@v4
        with:
          ref: 4a6e47e2905a4aa995f879045a907abee8b1aae5
          path: .baseline-sonku
          persist-credentials: false
          sparse-checkout: |
            engine/builtin_fx/sonku
          sparse-checkout-cone-mode: true
      - name: Render and numerically compare five native PCM music A/B tracks
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tools/sonku_offline_listening.cpp -o /tmp/sonku-integrity-audio
          /tmp/sonku-integrity-audio sonku-integrity-evidence --music-integrity-only
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic -DSONKU_AB_BASELINE tools/sonku_offline_listening.cpp -o /tmp/sonku-integrity-baseline
          /tmp/sonku-integrity-baseline sonku-integrity-baseline --music-integrity-only
          python tests/sonku_music_integrity_comparison.py sonku-integrity-baseline sonku-integrity-evidence
      - name: Broad KEMAR frequency-response integrity audit (44.1k/48k)
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tests/sonku_hrir_spectral_audit.cpp -o /tmp/sonku-hrir-audit
          /tmp/sonku-hrir-audit > sonku-integrity-evidence/KEMAR-SPECTRAL-AUDIT.csv
          test "$(($(wc -l < sonku-integrity-evidence/KEMAR-SPECTRAL-AUDIT.csv)-1))" -eq 380
      - name: Same-runner informational SonKu native realtime CPU check
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic tools/sonku_rt_benchmark.cpp -o /tmp/sonku-integrity-cpu
          /tmp/sonku-integrity-cpu
      - name: Upload original lossless music-integrity proof
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-SonKu-Phase-Integrity-${{ github.run_id }}
          path: |
            sonku-integrity-evidence/*
            sonku-integrity-baseline/*
          if-no-files-found: ignore
          retention-days: 14

  vocal-throw-preview:
    name: Vocal Delay native editor desktop/mobile Chromium FAT
    needs: quick
    # Run dedicated Vocal Delay visual validation in the reconciled native
    # engine branch too; generic /preview/ smoke does not call this fixture.
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'release/vocal-delay-') || startsWith(github.head_ref, 'feature/arson-vocal-throw-') || startsWith(github.head_ref, 'integration/arson-vocal-throw-') || github.head_ref == 'integration/asio4all-harmony-d4-compat-20261109') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for targeted Vocal Delay UI
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Check exact mixer picker, native ACK and editor in desktop/mobile
        run: python tests/approved_native_vocal_throw_smoke.py
      - name: Keep compact editor screenshot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-Vocal-Delay-Desktop-Mobile-${{ github.run_id }}
          path: arsonmix-vocal-throw-*.png
          if-no-files-found: ignore
          retention-days: 7

  operator-ux-fat:
    name: Operator UX real Chromium / native-assembled GUI (5 viewports)
    needs: quick
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'fix/approved-operator-ux-20261107' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for UX FAT
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Measure actual layout, close keys, floating move and small-screen scaling
        run: |
          python tests/approved_operator_ux_chromium_fat.py
          python tests/approved_operator_ux_native_identity_smoke.py
      - name: Retain rendered evidence across viewport sizes
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-Operator-UX-5-viewports-${{ github.run_id }}
          path: operator-ux-*.png
          if-no-files-found: ignore
          retention-days: 7

  compressor-preview:
    name: Native Compressor actual Chromium screenshot and ACK FAT
    needs: quick
    if: ${{ github.event_name == 'pull_request' && (github.head_ref == 'feature/native-zero-latency-compressor-20261108' || github.head_ref == 'feature/native-compressor-live-lcd-meters-20261108' || (startsWith(github.head_ref, 'feature/compressor-') || startsWith(github.head_ref, 'fix/compressor-'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium (one scoped compressor UI test)
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Render real approved GUI, insert compressor and verify DSP ACK/readback
        run: python tests/approved_native_compressor_smoke.py
      - name: Verify EQ editor power/Close and actual SVG gestures
        run: python tests/approved_native_peq_smoke.py
      - name: Verify global Close styling and contextual controls across published GUI
        run: |
          python tests/pages_contextual_buttons_smoke.py
          python tests/pages_contextual_contrast_smoke.py
      - name: Upload exact assembled native editor screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-Native-Compressor-Approved-GUI-${{ github.run_id }}
          path: arsonmix-native-compressor-*.png
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Full Chromium /preview/ visual and interaction qualification
    # Draft edits are cheap; ChatGPT milestone comments dispatch this full suite.
    needs: quick
    # Scoped SonKu exact-SHA milestone gets its own shorter visual + pointer FAT.
    # Do not also run the full generic Chromium suite for the same manual SHA.
    if: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/feat/8d-sonku-') && inputs.expected_sha != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cheap canonical Console v6 puzzle socket gate
        run: node scripts/check_console_puzzle.mjs
      - name: Stop incomplete integrated product promotion before browser setup
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'integration/product-') }}
        run: node scripts/check_console_puzzle.mjs --release
      - name: Verify CSS ownership build and offline/WebView2 parity
        run: python scripts/build_ui_css.py --check
      - name: Stage C deterministic CSS compiler priority and safety regression
        run: python -m unittest discover -s tests -p approved_css_stage_c_compiler_test.py -v
      - name: Prevent any NEW CSS stacking across approved /preview/ owners
        run: |
          python scripts/check_preview_css_ownership.py
          python -m unittest discover -s tests -p approved_preview_css_owner_nonregression_test.py -v
      - name: Verify immutable approved Brushed Metal CSS and non-destructive preview
        run: python tests/theme_reference_fixture_test.py
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --check site/preview-v2/assets/gui-perf-probe.js
          node --check web/plugin-ui.js
          node --check web/mixer-io.js
          node --check web/mixer-layout.js
          node --test tests/workstream_coordination_contract.test.mjs tests/chat_ci_dispatch_contract.test.mjs tests/gui_workflow_contract_test.mjs tests/plugin_ui_contract_test.mjs tests/ci_workflow_efficiency_test.mjs tests/fx_drag_reorder_contract_test.mjs tests/mixer_io_operator_contract_test.mjs tests/mixer_shell_contract_test.mjs tests/approved_native_m2_contract.test.cjs
      - name: Validate approved GUI checkpoint and single publisher
        run: python tests/gui_baseline_lock_test.py
          python tests/mixer_physical_keys_contract.py
      - name: CSS V28 zero-regression source-order recovery (every GUI CI run)
        run: python tests/css_v28_restore.py
      - name: Verify ONLY approved public GUI /preview/ with PNG hardware keys
        run: |
          python scripts/build_pages.py --out dist-pages --sha "${{ github.event_name == 'workflow_dispatch' && inputs.expected_sha != '' && inputs.expected_sha || github.sha }}" --branch main
          python tests/single_preview_publication_contract_test.py dist-pages
      - name: Validate smart audio architecture handoff contract
        run: node --test tests/smart_audio_ard_contract_test.mjs
      - name: WIRE A canonical graph and v8 GUI-to-native handoff contract
        run: |
          node tests/wire_graph_canonical_model.test.cjs
          node tests/wire_main_native_handoff_contract.test.cjs
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
