name: UI smoke (Chromium)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'site/**'
      - 'AR-MIX-Live-FX-Host-Standalone-v0.3.html'
      - 'scripts/build_pages.py'
      - 'tests/**'
      - '.github/workflows/ui-smoke.yml'
      - '.github/workflows/pages-publish.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'docs/GUI_BASELINE_LOCK_2026-10-25.md'
      - 'docs/ARD_SMART_AUDIO_ENGINE_V1_2026-10-25.md'
      - 'docs/SMART_AUDIO_ENGINE_IMPLEMENTATION_BLUEPRINT.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Standalone UI and geometry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify CSS ownership build and offline/WebView2 parity
        run: python scripts/build_ui_css.py --check
      - name: Verify frozen Brushed Metal styling reference and HTML parity
        run: python tests/theme_reference_fixture_test.py
      - name: Validate JavaScript syntax
        run: |
          node --check web/app.js
          node --test tests/gui_workflow_contract_test.mjs
      - name: Validate approved GUI checkpoint and single publisher
        run: python tests/gui_baseline_lock_test.py
      - name: Validate smart audio architecture handoff contract
        run: node --test tests/smart_audio_ard_contract_test.mjs
      - name: Install Chromium testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify original metallic asset and standalone synchronization
        run: python tests/fader_asset_test.py
      - name: Validate recessed Button 180 + embedded Inter font contract
        run: python tests/button_asset_test.py
      - name: Verify original PAN slider and CSS buttons
        run: python tests/pan_button_asset_test.py
      - name: Run mixer UI smoke tests
        run: python tests/ui_smoke.py
      - name: Attach visual regression screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arsonmix-gui-baseline-smoke
          path: |
            fader-ui-smoke.png
            mixer-design-review.png
            mixer-design-review-1440.png
            mixer-master-clip-review.png
            mixer-pro-view-review.png
            mixer-master-dual-metric-left-rail.png
            mixer-crystal-candy-review.png
            mixer-crystal-depth-glow-review.png
            mixer-inter-recessed-toggle-review.png
            mixer-left-rail-unified-button180-pan-131512.png
          if-no-files-found: ignore
