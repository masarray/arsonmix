name: Inno Setup graceful update smoke
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'installer/ArSonMix.iss'
      - 'scripts/build_verify_windows_installer.ps1'
      - 'scripts/test_inno_graceful_update_windows.ps1'
      - 'tests/fixtures/installer_graceful_close.cs'
      - 'tests/windows_installer_contract_test.mjs'
  push:
    branches: [main]
    paths:
      - 'installer/ArSonMix.iss'
      - 'scripts/build_verify_windows_installer.ps1'
      - 'scripts/test_inno_graceful_update_windows.ps1'
      - 'tests/fixtures/installer_graceful_close.cs'
      - 'tests/windows_installer_contract_test.mjs'
permissions:
  contents: read
concurrency:
  group: inno-upgrade-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inno-smoke:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check installer safety and single-launch contracts
        run: node --test tests/windows_installer_contract_test.mjs
      - name: Prepare Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              -not (Test-Path -LiteralPath 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compiler installation failed' }
          }
      - name: Real silent Inno upgrade of running WinForms fixture and Studio retention
        shell: pwsh
        run: ./scripts/test_inno_graceful_update_windows.ps1
