name: ImerSip P9.2 same native SonKu engine — isolated Windows FAT
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/imersip-p92-single-engine.yml'
      - 'CMakeLists.txt'
      - 'engine/builtin_fx/ImerSipP92*.h'
      - 'assets/imersip/**'
      - 'tests/imersip_scene_assets_contract_test.py'
      - 'engine/builtin_fx/SonKuSpatialProcessor.h'
      - 'engine/builtin_fx/sonku/**'
      - 'src/Main.cpp'
      - 'src/NativeBuiltInFx.h'
      # Native/engine edits only. Documentation and immutable-checkpoint
      # ledger changes have a separate fast contract job, not full JUCE.
      - 'tests/imersip_p92_native_test.cpp'
      - 'tests/imersip_p92_catalog_contract_test.py'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character candidate SHA; never qualify moving main"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: imersip-p92-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Fast P9 PCM + ImerSip registration guard
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify pinned manual source HEAD
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_EXACT_SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "WRONG_EXACT_SHA"; exit 1; }
      - name: Gate accepted six real venue PNGs; forbid rejected asset pack
        run: python -m unittest discover -s tests -p 'imersip_scene_assets_contract_test.py' -v
      - name: Source contract and no accidental shadow DSP
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'imersip_p92_*contract_test.py' -v
      - name: Exact P9.1+P9.2 native PCM foundation 44.1/48k
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            tests/sonku_p91_p92_music_bass_foundation_test.cpp -o /tmp/p92-source
          /tmp/p92-source
      - name: Test ImerSip concert preset audibility, anti-phase and wet room
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            tests/imersip_p92_factory_music_test.cpp -o /tmp/imersip-p92-presets
          /tmp/imersip-p92-presets
      - name: ImmerSIB P9.7 Venue golden and P9.8 scene native PCM
        run: |
          set -euo pipefail
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH \
            -DSONKU_P72_NATIVE_XYZ_RT \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH \
            -DSONKU_P87_MUSIC_BODY_RESEARCH \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH \
            -DSONKU_P94_FRONT_BACK_DEPTH_RESEARCH \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH \
            -DSONKU_P98_SCENE_VOICING_RESEARCH \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DSONKU_IMMERSIB_PCM_DIAGNOSTICS=1 \
            tests/immersib_p98_native_sonic_gate.cpp -o /tmp/immersib-p98
          /tmp/immersib-p98
  windows:
    name: Actual JUCE ImerSip P9.2 insert + Windows GUI
    needs: source
    # Per-commit PCM source contracts remain automatic; expensive Windows
    # diagnostic only on a manually pinned SHA (full P1 gate still required).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify immutable source commit
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          if ((& git rev-parse HEAD).Trim() -ne $env:EXPECTED_SHA) {
            throw 'IMERSIP_P92_WRONG_SOURCE_SHA'
          }
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Obtain pinned WebView2 headers
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure exact P9 native FX graph and focused CTest
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_ROOT="$env:GITHUB_WORKSPACE/third_party/JUCE" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE/.deps" `
            -DARMIX_SONKU_EXPERIMENTAL_NATIVE_XYZ_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_MUSIC_SAFE=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P8_TRANSPARENT_BASS=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P82_ROOM=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P83_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P84_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P85_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P86_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P87_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P88_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P89_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P90_NATIVE_RT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P94_FRONT_BACK_DEPTH=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P95_MUSICAL_PRESENCE=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P96_DISTANCE_REINFORCEMENT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P97_STAGE_IMPACT=ON `
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=ON `
            -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON `
            -DARMIX_SONKU_APPROVED_P99_MAIN=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = (& ctest --test-dir build -C Release --show-only=json-v1 | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ('NativeImmerSIBJucePresetACKStateAndBypass' -notin
              @($tests.tests | ForEach-Object {$_.name})) {
            throw 'IMERSIP_P92_NATIVE_TEST_NOT_COMPILED'
          }
      - name: Compile focused real JUCE audio editor and state first
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixImerSipP92NativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure `
            -R '^NativeImmerSIBJucePresetACKStateAndBypass$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual JUCE native 100, 125, 150 and 200 percent captures
        uses: actions/upload-artifact@v4
        with:
          name: ImerSip-P92-Native-JUCE-DPI-Captures-${{ github.run_id }}
          path: |
            build/ImerSip_P92_JUCE_*.png
            build/ImerSip_P92_SCENE_*.png
          if-no-files-found: error
          retention-days: 14
      - name: Compile authentic production-shaped native GUI research candidate
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixConsole
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = 'build/ARMixConsole_artefacts/Release/AR MIX Studio.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'IMERSIP_P92_GUI_MISSING'
          }
      - name: Package and verify portable Windows application
        shell: pwsh
        run: |
          & ./scripts/package_native_windows.ps1 -BuildDir build -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/factoryfx_release_bundle.py stage --lock config/factoryfx-approved-releases.json --output dist --best-effort
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/verify_native_windows_artifact.ps1 -OutputDir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The release verifier scans the compiled EXE for the full MIT KEMAR
          # notice and AGPLv3. Only the field-test instruction remains outside
          # verified dist/; don't scatter redundant legal files in artifacts.
          New-Item -ItemType Directory -Path field_candidate -Force | Out-Null
          Copy-Item -LiteralPath dist -Destination field_candidate/ArSonMix-Portable -Recurse
          Copy-Item -LiteralPath docs/IMERSIP_P92_SINGLE_NATIVE_ENGINE_FAT_20261116.md -Destination field_candidate/IMERSIP_P92_FIELD_FAT.md
      - uses: actions/upload-artifact@v4
        with:
          name: ImerSip-P92-Shared-Core-Windows-x64-${{ github.run_id }}
          path: field_candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Recompile default public SonKu P9.9 profile with ImmerSIB RC OFF
        shell: pwsh
        run: |
          # Reuse the same Windows checkout and build tree AFTER RC artifact
          # upload. This proves default/public build compatibility without
          # allocating a second Windows runner or changing the RC package.
          $sourceSha = (& git rev-parse HEAD).Trim()
          $candidate = Get-Content -LiteralPath dist/BUILD_PROVENANCE.json -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($candidate.sourceCommit -ne $sourceSha) {
            throw 'PUBLIC_PROFILE_CANDIDATE_SOURCE_MISMATCH'
          }
          $cmakeText = Get-Content -LiteralPath CMakeLists.txt -Raw -Encoding UTF8
          $flags = @([regex]::Matches($cmakeText, '(?m)^\s*option\((ARMIX_SONKU_EXPERIMENTAL_[A-Z0-9_]+)') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($flags.Count -lt 10) { throw 'PUBLIC_PROFILE_RESEARCH_OPTION_AUDIT_INCOMPLETE' }
          $args = @('-S','.','-B','build','-DARMIX_IMMERSIB_RELEASE_CANDIDATE=OFF')
          foreach ($flag in $flags) { $args += "-D${flag}=OFF" }
          & cmake @args
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_PROFILE_CMAKE_CONFIGURE_FAILED' }
          # Get-Content without -Raw yields exact logical lines on Windows
          # (CMakeCache.txt uses CRLF). Regex end-of-line checks on raw CRLF
          # incorrectly rejected valid OFF/ON cache entries.
          $cacheLines = @(Get-Content -LiteralPath build/CMakeCache.txt -Encoding UTF8)
          $expected = @('ARMIX_IMMERSIB_RELEASE_CANDIDATE:BOOL=OFF',
                        'ARMIX_SONKU_APPROVED_P99_MAIN:BOOL=ON')
          foreach ($entry in $expected) {
            if ($entry -notin $cacheLines) {
              $key = ($entry -split ':')[0]
              $actual = @($cacheLines | Where-Object { $_.StartsWith("${key}:") })
              throw "PUBLIC_PROFILE_OPTION_MISMATCH: expected=$entry actual=$($actual -join ',')"
            }
          }
          foreach ($flag in $flags) {
            if ("${flag}:BOOL=OFF" -notin $cacheLines) {
              $actual = @($cacheLines | Where-Object { $_.StartsWith("${flag}:") })
              throw "PUBLIC_PROFILE_RESEARCH_FLAG_ENABLED: $flag actual=$($actual -join ',')"
            }
          }
          $catalog = (& ctest --test-dir build -C Release --show-only=json-v1 | Out-String | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_PROFILE_CTEST_CATALOG_FAILED' }
          $tests = @($catalog.tests | ForEach-Object { $_.name })
          if ('NativeImmerSIBJucePresetACKStateAndBypass' -in $tests) {
            throw 'PUBLIC_PROFILE_IMMERSIB_TEST_STILL_REGISTERED'
          }
          if ('NativeSonKuSessionV1V2AndAudioAppliedAck' -notin $tests) {
            throw 'PUBLIC_PROFILE_SONKU_REGRESSION_MISSING'
          }
          & cmake --build build --config Release --parallel 2 --target ARMixConsole ARMixSonKuNativeStateTests
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_PROFILE_WINDOWS_BUILD_FAILED' }
          & ctest --test-dir build -C Release --output-on-failure -R '^NativeSonKuSessionV1V2AndAudioAppliedAck$'
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_PROFILE_SONKU_STATE_REGRESSION' }
          $exe = 'build/ARMixConsole_artefacts/Release/AR MIX Studio.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'PUBLIC_PROFILE_WINDOWS_GUI_MISSING'
          }
          $publicSha = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publicSha -eq $candidate.exeSha256) {
            throw 'PUBLIC_PROFILE_SAME_BINARY_AS_IMMERSIB_RC'
          }
          Write-Host "PUBLIC_PROFILE_RC_OFF_BUILD_ACCEPTED: source=$sourceSha exeSha256=$publicSha"
          Write-Host 'RC PACKAGE UNCHANGED: verified artifact uploaded before public-profile recompile'
