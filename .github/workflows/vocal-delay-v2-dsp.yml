name: Vocal Delay V2 isolated DSP
on:
  pull_request:
    paths:
      - 'engine/builtin_fx/vocal_delay/**'
      - 'tests/vocal_delay_v2_*.cpp'
      - 'tools/vocal-delay/**'
      - '.github/workflows/vocal-delay-v2-dsp.yml'
permissions:
  contents: read
concurrency:
  group: vocal-delay-v2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - cxx: g++
            flags: '-O2'
          - cxx: clang++
            flags: '-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile real core and legacy baseline
        run: |
          git rev-parse HEAD
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror ${{ matrix.flags }} tests/vocal_delay_v2_core_test.cpp tests/vocal_delay_v2_heap_probe.cpp -o /tmp/vd2
          /tmp/vd2
          ${{ matrix.cxx }} -std=c++17 ${{ matrix.flags }} tests/builtin_vocal_throw_test.cpp -o /tmp/vd1
          /tmp/vd1
          ${{ matrix.cxx }} -std=c++17 -Wall -Wextra -Werror -pthread ${{ matrix.flags }} tests/vocal_delay_v2_session_test.cpp tests/vocal_delay_v2_heap_probe.cpp -o /tmp/vd2session
          /tmp/vd2session
  ui-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: node tools/vocal-delay/parameter-sync.test.mjs
  native-juce-candidate:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Build and run real JUCE adapter (not full mixer)
        shell: pwsh
        run: |
          cmake -S tools/vocal-delay/native -B vd-build -G "Visual Studio 17 2022" -A x64 "-DJUCE_ROOT=$env:GITHUB_WORKSPACE/third_party/JUCE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build vd-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir vd-build -C Release --output-on-failure --no-tests=error
