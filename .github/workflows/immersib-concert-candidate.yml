name: ImmerSIB concert candidate — C++ DSP source gate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/immersib-concert-candidate.yml'
      - 'tests/immersib_concert_stereo_candidate_test.cpp'
      - 'tests/immersib_concert_native_core_test.cpp'
      - 'engine/builtin_fx/sonku/SonKuP90StereoDecoder.h'
      - 'engine/builtin_fx/sonku/SonKuP94FrontBackDepthCue.h'
      - 'tests/immersib_stage_room_balance_test.cpp'
      - 'tests/immersib_midrange_full_graph_probe.cpp'
      - 'engine/builtin_fx/sonku/SonKuP98SceneVoicing.h'
      - 'engine/builtin_fx/sonku/SonKuImmerSIBVocalRoom.h'
      - 'engine/builtin_fx/sonku/SonKuP99MusicalVocalDepth.h'
      - 'scripts/package_immersib_concert_listening_preview.ps1'
      - 'tests/imersip_p92_native_test.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-math:
    name: C++ 44.1/48k center, panning, vocal room and LF safety
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and run independent candidate source regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/immersib_concert_stereo_candidate_test.cpp \
            -o /tmp/armix-immersib-concert-candidate
          /tmp/armix-immersib-concert-candidate
          # A/B table-based stage correction: actual P83 L/R directions,
          # original single-source P94 untouched and room-off bit-exact.
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/immersib_stage_room_balance_test.cpp \
            -o /tmp/armix-immersib-stage-room
          /tmp/armix-immersib-stage-room
          # Full 2x2 KEMAR + six-wall P9, INCLUDING P94 as in the
          # production JUCE P99 flag set. Old synthetic test silently
          # omitted P94, so v4/v5 full-PCM isolation could not work.

          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            -DSONKU_P94_FRONT_BACK_DEPTH_RESEARCH=1 \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH=1 \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH=1 \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH=1 \
            -DSONKU_P98_SCENE_VOICING_RESEARCH=1 \
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=1 \
            -DSONKU_P99_MUSICAL_VOCAL_DEPTH_RESEARCH=1 \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DARMIX_IMMERSIB_CONCERT_CANDIDATE=1 \
            tests/immersib_concert_native_core_test.cpp \
            -o /tmp/armix-immersib-concert-native-core
          /tmp/armix-immersib-concert-native-core
          # Full P9 stereo ear (not a hypothetical EQ transfer):
          # room ON/OFF, old P90, v4 P90 and v5 P94, including P95/limiter.
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            -DSONKU_P94_FRONT_BACK_DEPTH_RESEARCH=1 \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH=1 \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH=1 \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH=1 \
            -DSONKU_P98_SCENE_VOICING_RESEARCH=1 \
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=1 \
            -DSONKU_P99_MUSICAL_VOCAL_DEPTH_RESEARCH=1 \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DSONKU_IMMERSIB_PCM_DIAGNOSTICS=1 \
            -DARMIX_IMMERSIB_CONCERT_CANDIDATE=1 \
            tests/immersib_midrange_full_graph_probe.cpp \
            -o /tmp/armix-immersib-mid-probe
          /tmp/armix-immersib-mid-probe
          echo 'IMMERSIB_CONCERT_SOURCE_GATE=PASS (not an acoustic release approval)'

  native-juce-windows:
    name: Actual Windows JUCE ImmerSIB candidate compilation (no installer)
    needs: native-math
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Checkout JUCE 8.0.15
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Obtain pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure opt-in native ImmerSIB from exact FUX-1-derived SHA
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_ROOT="$env:GITHUB_WORKSPACE/third_party/JUCE" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE/.deps" `
            -DARMIX_SONKU_APPROVED_P99_MAIN=ON `
            -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON `
            -DARMIX_IMMERSIB_CONCERT_CANDIDATE=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cache = Get-Content -LiteralPath build/CMakeCache.txt
          foreach ($entry in @('ARMIX_IMMERSIB_RELEASE_CANDIDATE:BOOL=ON',
                               'ARMIX_IMMERSIB_CONCERT_CANDIDATE:BOOL=ON')) {
            if ($entry -notin $cache) { throw "IMMERSIB_CONCERT_CANDIDATE_CACHE_FLAG_MISSING:$entry" }
          }
          $catalog = (& ctest --test-dir build -C Release --show-only=json-v1 | Out-String | ConvertFrom-Json)
          if ('NativeImmerSIBJucePresetACKStateAndBypass' -notin
              @($catalog.tests | ForEach-Object {$_.name})) {
            throw 'IMMERSIB_CONCERT_CANDIDATE_NATIVE_TEST_NOT_CONFIGURED'
          }
      - name: Compile actual JUCE ImmerSIB FX processor/editor candidate
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixImerSipP92NativeTests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host 'IMMERSIB_CONCERT_WIN_JUCE_COMPILE=PASS candidate source; not audio-approved'
      - name: Test real JUCE ImmerSIB audio-applied ACK and state parity
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure -R NativeImmerSIBJucePresetACKStateAndBypass
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_CANDIDATE_NATIVE_JUCE_REGRESSION_FAILED' }
      - name: Build ACTUAL Windows ArSonMix mixer (not a test executable)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixConsole
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_CANDIDATE_REAL_WINDOWS_APP_BUILD_FAILED' }
      - name: Verify binary, legal text, single approved GUI and package EXPLICITLY UNAPPROVED portable listening candidate
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          & ./scripts/package_immersib_concert_listening_preview.ps1 -BuildDir build -OutputDir listening_candidate -ExpectedSha $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_CANDIDATE_PORTABLE_PACKAGE_FAILED' }
      - name: Upload owner headphone A/B Windows portable (NOT STABLE RELEASE)
        uses: actions/upload-artifact@v4
        with:
          name: ArSonMix-ImmerSIB-FUX1-Listening-Windows-x64-${{ github.run_id }}
          path: listening_candidate/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

