name: ImmerSIB concert candidate — C++ DSP source gate
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/immersib-concert-candidate.yml'
      - 'tests/immersib_concert_stereo_candidate_test.cpp'
      - 'tests/immersib_concert_native_core_test.cpp'
      - 'engine/builtin_fx/sonku/SonKuP90StereoDecoder.h'
      - 'engine/builtin_fx/sonku/SonKuP98SceneVoicing.h'
      - 'engine/builtin_fx/sonku/SonKuImmerSIBVocalRoom.h'
      - 'engine/builtin_fx/sonku/SonKuP99MusicalVocalDepth.h'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-math:
    name: C++ 44.1/48k center, panning, vocal room and LF safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compile and run independent candidate source regression
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++20 -O2 -Wall -Wextra -Werror -pedantic \
            tests/immersib_concert_stereo_candidate_test.cpp \
            -o /tmp/armix-immersib-concert-candidate
          /tmp/armix-immersib-concert-candidate
          # The whole 2x2 KEMAR + 6-wall SonKu P9 graph, not just filter units.
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH=1 \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH=1 \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH=1 \
            -DSONKU_P98_SCENE_VOICING_RESEARCH=1 \
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=1 \
            -DSONKU_P99_MUSICAL_VOCAL_DEPTH_RESEARCH=1 \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DARMIX_IMMERSIB_CONCERT_CANDIDATE=1 \
            tests/immersib_concert_native_core_test.cpp \
            -o /tmp/armix-immersib-concert-native-core
          /tmp/armix-immersib-concert-native-core
          echo 'IMMERSIB_CONCERT_SOURCE_GATE=PASS (not an acoustic release approval)'
