name: ImmerSIB P102.3 approved integration and Windows regression
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - '.github/workflows/immersib-musical-eq.yml'
      - 'engine/builtin_fx/sonku/SonKuFixedPaMusicalEq.h'
      - 'tests/immersib_fixed_pa_musical_eq_test.cpp'
      - 'scripts/package_immersib_musical_eq.ps1'
      - 'engine/builtin_fx/sonku/SonKuP90StereoDecoder.h'
      - 'engine/builtin_fx/sonku/SonKuP94FrontBackDepthCue.h'
      - 'engine/builtin_fx/sonku/SonKuP98SceneVoicing.h'
      - 'engine/builtin_fx/sonku/SonKuHrtfTonalCalibration.h'
      - 'engine/builtin_fx/sonku/SonKuSpatialCore.h'
      - 'engine/builtin_fx/SonKuSpatialProcessor.h'
      - 'engine/builtin_fx/ImerSipP92Processor.h'
      - 'tests/immersib_fixed_stage_monitor_test.cpp'
      - 'config/immersib_approved_pcm_sources.json'
      - 'config/spatial_audio_authority.json'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact 40-character candidate SHA; never qualify moving main"
        required: true
        type: string

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/fx-change-scope.yml
    with:
      paths: |
        .github/workflows/immersib-musical-eq.yml
        engine/builtin_fx/sonku/SonKuFixedPaMusicalEq.h
        tests/immersib_fixed_pa_musical_eq_test.cpp
        scripts/package_immersib_musical_eq.ps1
        engine/builtin_fx/sonku/SonKuP90StereoDecoder.h
        engine/builtin_fx/sonku/SonKuP94FrontBackDepthCue.h
        engine/builtin_fx/sonku/SonKuP98SceneVoicing.h
        engine/builtin_fx/sonku/SonKuHrtfTonalCalibration.h
        engine/builtin_fx/sonku/SonKuSpatialCore.h
        engine/builtin_fx/SonKuSpatialProcessor.h
        engine/builtin_fx/ImerSipP92Processor.h
        tests/immersib_fixed_stage_monitor_test.cpp
        config/immersib_approved_pcm_sources.json
        config/spatial_audio_authority.json
        .github/workflows/fx-change-scope.yml
  fixed-pa-math:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    name: Actual 44.1/48k P90/P98 and seven-scene P9 PCM (no JUCE)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify pinned manual source HEAD
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "INVALID_EXACT_SHA"; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]] || { echo "WRONG_EXACT_SHA"; exit 1; }
      - name: Compile actual published-P9-flagset source + research opt-in
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_immersib_approved_pcm_sources.py
          python3 -m unittest discover -s tests -p 'imersip_p92_authority_contract_test.py' -v
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            -DSONKU_P94_FRONT_BACK_DEPTH_RESEARCH=1 \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH=1 \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH=1 \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH=1 \
            -DSONKU_P98_SCENE_VOICING_RESEARCH=1 \
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=1 \
            -DSONKU_P99_MUSICAL_VOCAL_DEPTH_RESEARCH=1 \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DARMIX_IMMERSIB_STAGE_MONITOR_RESEARCH=1 \
            tests/immersib_fixed_stage_monitor_test.cpp \
            -o /tmp/armix-immersib-fixed-speaker-stage
          /tmp/armix-immersib-fixed-speaker-stage
          echo "FIXED_PA_FULL_PCM_SOURCE_GATE=PASS; headphone listening not certified"
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic \
            -DSONKU_P7_MEASURED_ELEVATION_RESEARCH=1 \
            -DSONKU_P71_DIRECT_XYZ_RESEARCH=1 \
            -DSONKU_P72_NATIVE_XYZ_RT=1 \
            -DSONKU_P75_MUSIC_SAFE_RESEARCH=1 \
            -DSONKU_P80_TRANSPARENT_BASS_RESEARCH=1 \
            -DSONKU_P82_MULTIBAND_ROOM_RESEARCH=1 \
            -DSONKU_P83_PHYSICAL_SPEAKER_RESEARCH=1 \
            -DSONKU_P84_SINGLE_CORE_FUSION_RESEARCH=1 \
            -DSONKU_P85_WORLD_COHERENCE_RESEARCH=1 \
            -DSONKU_P86_HORIZONTAL_FOCUS_RESEARCH=1 \
            -DSONKU_P87_MUSIC_BODY_RESEARCH=1 \
            -DSONKU_P88_PERCEPTUAL_ALIGNMENT_RESEARCH=1 \
            -DSONKU_P89_DEPTH_COHERENCE_RESEARCH=1 \
            -DSONKU_P90_TRUE_EXTERNAL_RESEARCH=1 \
            -DSONKU_P94_FRONT_BACK_DEPTH_RESEARCH=1 \
            -DSONKU_P95_MUSICAL_PRESENCE_RESEARCH=1 \
            -DSONKU_P96_DISTANCE_REINFORCEMENT_RESEARCH=1 \
            -DSONKU_P97_STAGE_IMPACT_RESEARCH=1 \
            -DSONKU_P98_SCENE_VOICING_RESEARCH=1 \
            -DARMIX_SONKU_EXPERIMENTAL_P98_SCENE_VOICING=1 \
            -DSONKU_P99_MUSICAL_VOCAL_DEPTH_RESEARCH=1 \
            -DSONKU_IMMERSIB_P99_VOCAL_ROOM_RESEARCH=1 \
            -DARMIX_IMMERSIB_STAGE_MONITOR_RESEARCH=1 \
            -DARMIX_IMMERSIB_MUSICAL_EQ_RESEARCH=1 \
            tests/immersib_fixed_pa_musical_eq_test.cpp -o /tmp/p102
          /tmp/p102

  windows-audition:
    name: Windows x64 JUCE mixer + real portable A/B, not public release
    needs: fixed-pa-math
    # Avoid a second full Windows rebuild for each incremental PCM edit.
    # The official protected P1 Windows gate remains unchanged.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: juce-framework/JUCE
          ref: 91ad83ae34a81e0833b1a2b0866f54846370ae53 # JUCE 8.0.15
          path: third_party/JUCE
          persist-credentials: false
      - name: Pinned WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.3485.44 -OutputDirectory .deps -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'WEBVIEW2_SDK_INSTALL_FAILED' }
      - name: Configure normal branded ImmerSIB product profile
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DJUCE_ROOT="$env:GITHUB_WORKSPACE/third_party/JUCE" `
            -DJUCE_WEBVIEW2_PACKAGE_LOCATION="$env:GITHUB_WORKSPACE/.deps" `
            -DARMIX_SONKU_APPROVED_P99_MAIN=ON `
            -DARMIX_IMMERSIB_RELEASE_CANDIDATE=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_STAGE_CONFIGURE_FAILED' }
          $cache = Get-Content -LiteralPath build/CMakeCache.txt
          foreach($flag in @('ARMIX_SONKU_APPROVED_P99_MAIN','ARMIX_IMMERSIB_RELEASE_CANDIDATE','ARMIX_IMMERSIB_STAGE_MONITOR_RESEARCH','ARMIX_IMMERSIB_MUSICAL_EQ_RESEARCH')) {
            if ("$($flag):BOOL=ON" -notin $cache) { throw "IMMERSIB_STAGE_FLAG_MISSING:$flag" }
          }
      - name: Build native regression and real JUCE editor/processor
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixImmerSIBFixedStageTests ARMixImerSipP92NativeTests ARMixImmerSIBMusicalEqTests
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_STAGE_TEST_COMPILE_FAILED' }
          ctest --test-dir build -C Release --output-on-failure -R "NativeImmerSIBFixedStageNoSpectralMaskingAndFullPCM|NativeImmerSIBJucePresetACKStateAndBypass|NativeImmerSIBFixedPaPlusMusicalEq"
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_STAGE_TEST_FAILED' }
      - name: Build ACTUAL ArSonMix mixer Windows x64 with approved /preview/
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 --target ARMixConsole
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_STAGE_MIXER_EXE_FAILED' }
      - name: Verify native binary, brand, legal, canonical GUI and source provenance
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          & ./scripts/package_immersib_musical_eq.ps1 -BuildDir build -OutputDir fixed_stage_AB -ExpectedSha $env:EXPECTED_SHA
          if ($LASTEXITCODE -ne 0) { throw 'IMMERSIB_STAGE_PACKAGING_FAILED' }
      - name: Publish qualified integration portable, NOT public installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArSonMix-ImmerSIB-P102-Refined-Clarity-x64-${{ github.run_id }}
          path: fixed_stage_AB/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
